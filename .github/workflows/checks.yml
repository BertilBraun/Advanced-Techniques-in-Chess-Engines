name: checks

on:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ruff pytest pydantic numpy pyyaml typing-extensions tensorboardX tensorboard \
            psutil chess GPUtil huggingface_hub fastapi httpx
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff check
        run: ruff check .
      - name: Python tests
        working-directory: py
        run: python -m pytest --import-mode=importlib ./test -q
      - name: Web backend tests
        working-directory: deployment/web/backend
        run: python -m pytest --import-mode=importlib test -q
