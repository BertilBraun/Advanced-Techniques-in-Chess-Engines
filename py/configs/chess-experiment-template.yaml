game: chess
run:
  run_name: chess-template
  tensorboard_run_directory: chess-template
  stage: clean_retrain
  requires_explicit_approval: true
  resume:
    mode: random_initialization
  hardware:
    provider_name: local
    offer_id: local
    gpu_model: unconfirmed
    gpu_count: 1
    logical_cpu_count: 8
    minimum_ram_gib: 8
    minimum_disk_gib: 1
  environment:
    runtime_image: local
    python_version: "3.12"
    torch_version: "2.12.1+cu126"
    cuda_version: "12.6"
    dependency_lock_path: py/requirements-training.lock
    dependency_lock_sha256: f027ad99a12742660107a2857b18cbc6b821a95971c2ecf2c4ad814c38116171
    minimum_open_file_soft_limit: 65536
training:
  save_path: py/training_data/chess
  network:
    num_layers: 12
    hidden_size: 112
    residual_context: {kind: squeeze_excitation, placement: every_second_block}
    num_policy_channels: 4
    num_value_channels: 2
    value_fc_size: 48
  trainer:
    global_batch_size: 2048
    local_batch_size: 2048
    optimizer: adamw
    precision: float32
    compilation: disabled
    learning_rate:
      kind: staged
      stages:
        - start_generation: 0
          value: 0.005
        - start_generation: 200
          value: 0.0035
        - start_generation: 500
          value: 0.002
    max_grad_norm: 0.5
    duplicate_multiplicity_weight_cap:
  topology:
    trainer:
      device_type: cpu
      process_group_backend: gloo
      rank_zero_device_id: 0
      ddp_device_ids: [0]
      cpu_threads: 1
      interop_threads: 1
    self_play:
      device_ids: [0, 0, 0, 0]
      parallel_games_per_process: 2
      tensorboard_processes: 1
      node_ids_to_pause_during_training: []
    evaluation:
      device_cycle: [0]
  lifecycle:
    replay:
      capacity:
        kind: linear
        start_generation: 0
        end_generation: 200
        start_value: 200000
        end_value: 2500000
        rounding: nearest
      maximum_capacity: 2500000
      maximum_policy_entries: 60
    credit:
      replay_ratio: 8
      optimizer_steps_per_quantum: 500
      maximum_optimizer_steps: 500000
      retained_checkpoint_interval_generations: 3
    inference_retention:
      recent_checkpoint_count: 11
      milestone_interval: 10
  limits:
    hourly_price: 1.0
    maximum_cost:
    maximum_wall_time_seconds: 172800
    maximum_open_file_count: 32768
    maximum_host_ram_percent: 95.0
    minimum_free_disk_gib: 0.1
    resource_telemetry_interval_seconds: 5.0
  random_seed: 0
evaluation:
  cadence_seconds: 1200
  job_timeout_seconds: 1200
  shutdown_grace_seconds: 30
  bootstrap_samples: 10000
  maximum_concurrent_jobs: 10
  dataset:
    path: py/reference/chess-evaluation-v1.bin
    source: {kind: engine_self_play, random_seed: 0, move_sampling_temperature: 1.0}
  openings:
    path: py/reference/chess-openings-v1.json
    opening_count: 50
    source: {kind: engine_beam, random_seed: 0, expanded_actions_per_position: 8, beam_width: 512}
  engine:
    kind: stockfish
    executable_path: engines/stockfish
    label_nodes: 10000
    match_nodes: 1000
    threads: 1
    hash_mib: 1024
    multi_pv: 8
    policy_softmax_temperature: 0.15
  definitions:
    - kind: fixed_dataset
      definition_id: fixed-dataset
    - kind: random
      definition_id: search-random
      maximum_game_plies: 200
      search: &evaluation_search
        searches_per_move: 64
        parallel_searches: 1
        exploration_constant: 1.0
        inference:
          inference_workers: 1
          inference_batch_size: 64
          outstanding_batches_per_worker: 1
    - kind: policy_random
      definition_id: policy-random
      maximum_game_plies: 200
    - kind: previous_checkpoint
      definition_id: previous-20m
      boundary_offset: 1
      maximum_game_plies: 200
      search: *evaluation_search
    - kind: previous_checkpoint
      definition_id: previous-40m
      boundary_offset: 2
      maximum_game_plies: 200
      search: *evaluation_search
    - kind: previous_checkpoint
      definition_id: previous-60m
      boundary_offset: 3
      maximum_game_plies: 200
      search: *evaluation_search
    - kind: stockfish
      definition_id: stockfish-level-0
      skill_level: 0
      maximum_game_plies: 200
      search: *evaluation_search
    - kind: stockfish
      definition_id: stockfish-level-1
      skill_level: 1
      maximum_game_plies: 200
      search: *evaluation_search
    - kind: stockfish
      definition_id: stockfish-level-2
      skill_level: 2
      maximum_game_plies: 200
      search: *evaluation_search
    - kind: stockfish
      definition_id: stockfish-level-3
      skill_level: 3
      maximum_game_plies: 200
      search: *evaluation_search
chess:
  self_play:
    search:
      full_searches: {kind: linear, start_generation: 0, end_generation: 20, start_value: 300, end_value: 600, rounding: nearest}
      fast_searches: {kind: linear, start_generation: 0, end_generation: 20, start_value: 75, end_value: 150, rounding: nearest}
      parallel_searches: 1
      dirichlet_epsilon: {kind: constant, value: 0.25}
      dirichlet_alpha: {kind: constant, value: 0.3}
      exploration_constant: {kind: constant, value: 1.5}
      first_play_urgency: {kind: zero}
      forced_playouts: {kind: disabled}
    inference:
      inference_workers: 2
      inference_batch_size: 64
      outstanding_batches_per_worker: 2
    start_position:
      kind: restart_state
      true_start_probability: 0.5
      candidate_visit_mass: 0.85
      minimum_candidates: 2
      maximum_candidates: 3
      maximum_absolute_root_value: 0.8
      minimum_remaining_plies: 15
      maximum_archive_positions: 50000
      maximum_age_generations: 20
    full_search_probability: {kind: constant, value: 0.25}
    retained_root_visit_fraction: {kind: constant, value: 0.6}
    greedy_after_ply: {kind: constant, value: 50}
    maximum_game_plies:
      kind: linear
      start_generation: 0
      end_generation: 50
      start_value: 200
      end_value: 600
      rounding: nearest
    force_fast_search_after_ply: {kind: constant, value: 250}
    starting_temperature: {kind: constant, value: 1.3}
    final_temperature: {kind: constant, value: 0.1}
    primary_sample_weight: {kind: constant, value: 1.0}
  objective:
    policy_loss_weight: {kind: constant, value: 1.0}
    value_loss_weight: {kind: constant, value: 0.5}
    root_value_blend: {kind: linear, start_generation: 10, end_generation: 30, start_value: 0.0, end_value: 0.15, rounding: none}
    auxiliary_targets: []
