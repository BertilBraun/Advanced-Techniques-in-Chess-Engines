game: go
run:
  run_name: go-7x7-template
  tensorboard_run_directory: go-7x7-template
  stage: clean_retrain
  requires_explicit_approval: true
  resume: {mode: random_initialization}
  hardware: {provider_name: local, offer_id: local, gpu_model: unconfirmed, gpu_count: 1, logical_cpu_count: 8, minimum_ram_gib: 8, minimum_disk_gib: 1}
  environment:
    runtime_image: local
    python_version: "3.12"
    torch_version: "2.12.0+cu130"
    cuda_version: "13.0"
    dependency_lock_path: py/requirements-training.lock
    dependency_lock_sha256: 55fbeff4630bd7c4f10c9af5ea081e415da15515de7ad34d140461ef21c21cfd
    stockfish_revision: cb3d4ee9b47d0c5aae855b12379378ea1439675c
    minimum_open_file_soft_limit: 1024
training:
  save_path: py/training_data/go-7x7
  network: {num_layers: 6, hidden_size: 64, se_placement: every_second_block, num_policy_channels: 2, num_value_channels: 1, value_fc_size: 32}
  self_play:
    search: {num_searches_per_turn: 128, fast_searches_proportion_of_full_searches: 0.25, playout_cap_randomization: 0.25, num_parallel_searches: 2, dirichlet_epsilon: 0.25, dirichlet_alpha: 0.3, c_param: 1.5, percentage_of_node_visits_to_keep: 0.0, min_visit_count: 0}
    inference: {inference_workers: 1, inference_batch_size: 64, outstanding_batches_per_worker: 2}
    num_moves_after_which_to_play_greedy: 40
    maximum_game_plies: 196
    starting_temperature: 1.0
    final_temperature: 0.1
  trainer:
    global_batch_size: 256
    local_batch_size: 256
    optimizer: adamw
    learning_rate: {stages: [{start_model_version: 0, learning_rate: 0.002}], optimizer_steps_per_model_version: 100}
  topology:
    trainer: {device_type: cpu, process_group_backend: gloo, rank_zero_device_id: 0, ddp_device_ids: [0], cpu_threads: 1, interop_threads: 1}
    self_play: {device_ids: [0], parallel_games_per_process: 8, tensorboard_processes: 1, node_ids_to_pause_during_training: []}
    evaluation: {device_cycle: [0]}
  lifecycle:
    credit: {replay_ratio: 8, optimizer_steps_per_quantum: 100, maximum_optimizer_steps: 100000, initial_replay_capacity_unique_positions: 100000, maximum_replay_capacity_unique_positions: 2500000, replay_capacity_ramp_model_versions: 200, retained_checkpoint_interval_steps: 100}
    evaluation: {interval_optimizer_steps: 100, full_interval_optimizer_steps: 200, timeout_seconds: 3600, maximum_attempts: 3, retry_backoff_seconds: 60}
    inference_retention: {recent_checkpoint_count: 11, milestone_interval: 10}
  limits: {cost_currency: EUR, hourly_price: 1.0, maximum_wall_time_seconds: 21600, maximum_open_file_count: 32768, maximum_host_ram_percent: 95.0, minimum_free_disk_gib: 0.1, resource_telemetry_interval_seconds: 5.0}
  random_seed: 0
go:
  rules: {scoring: area, komi_half_points: 15, maximum_moves: 196}
  representation: {board_size: 7, history_length: 8, binary_channel_count: 16, scalar_channel_count: 1, action_encoding: go-point-pass-v1, canonical_player_perspective: true}
  objective: {policy_loss_weight: 1.0, outcome_value_loss_weight: 1.0, root_value_loss_weight: 0.0}
  evaluation: {num_searches_per_turn: 64, num_games: 40, every_n_model_versions: 1, max_concurrent_tasks: 1, inference_workers: 1, inference_batch_size: 64, previous_model_offsets: [5, 10], historical_model_versions: [10, 20], evaluate_random: true}
