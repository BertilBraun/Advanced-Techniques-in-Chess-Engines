# Distillation probe on a single-GPU node (2026-08-26) — v8 with the node-specific paths replaced.
#
# `tools/distill_match.py` and `tools/build_chess_opening_manifest.py` need an experiment that
# validates and from which a `ChessImplementation` can be built. They use exactly four things:
# `chess.self_play` (the search schedule that `create_evaluation_search` resolves at the
# checkpoint's generation), `chess.objective` (the same, via `effective_search_value_discount_per_ply`),
# `training.topology.trainer.device_type`, and `evaluation.engine` (Stockfish, for manifest digests).
#
# It therefore `extends` the v8 production configuration rather than restating it: the teacher
# checkpoint at generation 322 came from that run, so the whole `chess:` block — the visit schedule,
# virtual_loss_weight, value_discount_per_ply, search_value_discount_per_ply 0.98 — stays byte
# identical to the run that produced it. Only what is untrue on this node is overridden below.
#
# This configuration describes an evaluation host, not a training run. Nothing here should ever be
# handed to `run.py`; the training-shaped fields survive only because the schema requires them.
extends: vast-chess-4day-production-v8.yaml
run:
  run_name: distillation-probe-chess-single-gpu
  tensorboard_run_directory: distillation-probe-chess-single-gpu
  requires_explicit_approval: false
  hardware:
    offer_id: distillation-probe-free-node
    gpu_model: NVIDIA GeForce RTX 3060
    gpu_count: 1
    logical_cpu_count: 16
    minimum_ram_gib: 16
training:
  # TrainingArgs requires global_batch_size == local_batch_size * trainer world size, and the world
  # size here is one GPU rather than v8's eight. Nothing in this configuration ever trains, so the
  # local batch size is kept at v8's 256 and the global batch size follows it down from 2048.
  trainer:
    global_batch_size: 256
  topology:
    trainer:
      ddp_device_ids: [0]
    self_play:
      device_ids: [0]
      node_ids_to_pause_during_training: []
    evaluation:
      device_cycle: [0]
evaluation:
  openings:
    path: /workspace/evaluation-artifacts/chess/chess-elite-2025-11-balanced-4moves-200-v1-openings.json
    opening_count: 200
    source:
      kind: chess_book
      selection_path: py/reference/chess-elite-2025-11-balanced-4moves-200-v1.tsv
      selection_sha256: 658a650994214be07a9706f744ce07eb9158b48af34a593f95efa9c70a2824dc
  engine:
    kind: stockfish
    executable_path: /workspace/alphazero-engine/engines/stockfish
  definitions:
    - kind: fixed_dataset
      definition_id: fixed-dataset
    - kind: previous_checkpoint
      definition_id: distillation-probe
      boundary_offset: 1
      boundary_parity: every
      opening_pair_count: 100
      maximum_game_plies: 300
      search:
        searches_per_move: 64
        parallel_searches: 1
        exploration_constant: 1.0
        inference:
          inference_workers: 1
          inference_batch_size: 64
          outstanding_batches_per_worker: 1
          sdpa_backend: memory_efficient
