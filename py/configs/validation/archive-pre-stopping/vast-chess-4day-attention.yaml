# Four-day attention production run (decided 2026-08-22 evening; launch after the overnight pre-flight).
# Recipe: r3 base + plane heads + the validated Phase A platform. Deliberately excluded pending controlled
# experiments: the four new auxiliary targets, adaptive search budget, early termination, replay ratio 10.
# Included beyond r3: Syzygy adjudication (improves adjudicated label quality), compilation, progressive
# sizing over three attention rungs (promotions time-scheduled at 12 h and 1.5 d, gated by the loss-EMA
# criterion). Resignation stays on per the r3 schedule (calibrated, from generation 70).
# Rung parameters double each step: 1.52M -> 3.07M -> 5.73M. Rung 1 sized to 11x128 after the
# 2026-08-23 throughput benchmark (documentation/benchmarks/progressive-sizing-throughput-rtx4070super-20260823):
# the 1M-class model gives 1.86x the searches/s of 12x176 in the production 4-process topology.
extends: vast-chess-8gpu-exp2-attention.yaml

run:
  run_name: vast-chess-4day-attention
  tensorboard_run_directory: vast-chess-4day-attention

training:
  save_path: py/training_data/validation/vast-chess-4day-attention
  trainer:
    compilation: default
  progressive_model_sizing:
    models:
      - model_id: chess-attention-11x128
        training_start_days: 0.0
        network:
          kind: attention
          num_layers: 11
          embedding_size: 128
          num_heads: 8
          feedforward_size: 256
          dropout: 0.0
          policy_head: {kind: dense, channels: 4}
          num_value_channels: 2
          value_fc_size: 48
      - model_id: chess-attention-12x176
        training_start_days: 0.5
        network:
          kind: attention
          num_layers: 12
          embedding_size: 176
          num_heads: 11
          feedforward_size: 352
          dropout: 0.0
          policy_head: {kind: dense, channels: 4}
          num_value_channels: 2
          value_fc_size: 48
      - model_id: chess-attention-14x224
        training_start_days: 1.5
        network:
          kind: attention
          num_layers: 14
          embedding_size: 224
          num_heads: 14
          feedforward_size: 448
          dropout: 0.0
          policy_head: {kind: dense, channels: 4}
          num_value_channels: 2
          value_fc_size: 48
  limits:
    hourly_price: 0.755
    maximum_cost: null
    maximum_wall_time_seconds: 345600
    manual_stop_file: /workspace/run-control/stop/vast-chess-4day-attention.stop
    maximum_open_file_count: 49152
    maximum_host_ram_percent: 92.0
    minimum_free_disk_gib: 1.0
    resource_telemetry_interval_seconds: 5.0

