game: chess
run:
  run_name: vast-r11-chess
  tensorboard_run_directory: vast-r11-chess
  stage: systems_pilot
  requires_explicit_approval: true
  resume:
    mode: random_initialization
  hardware:
    provider_name: vast.ai
    offer_id: instance-47261298-host-95290
    gpu_model: NVIDIA GeForce RTX 3060
    gpu_count: 1
    logical_cpu_count: 32
    minimum_ram_gib: 32
    minimum_disk_gib: 20
  environment:
    runtime_image: vastai/pytorch:cuda-13.0.3-auto
    python_version: "3.12"
    torch_version: "2.12.1+cu126"
    cuda_version: "12.6"
    dependency_lock_path: py/requirements-training.lock
    dependency_lock_sha256: f027ad99a12742660107a2857b18cbc6b821a95971c2ecf2c4ad814c38116171
    minimum_open_file_soft_limit: 32768
training:
  save_path: py/training_data/validation/vast-r11-chess
  network:
    num_layers: 2
    hidden_size: 32
    residual_context: {kind: squeeze_excitation, placement: every_second_block}
    num_policy_channels: 2
    num_value_channels: 1
    value_fc_size: 16
  trainer:
    global_batch_size: 8
    local_batch_size: 8
    optimizer: adamw
    learning_rate:
      kind: constant
      value: 0.001
    max_grad_norm: 0.5
    duplicate_multiplicity_weight_cap:
  topology:
    trainer:
      device_type: cuda
      process_group_backend: nccl
      rank_zero_device_id: 0
      ddp_device_ids:
        - 0
      cpu_threads: 4
      interop_threads: 1
    self_play:
      device_ids:
        - 0
      parallel_games_per_process: 4
      tensorboard_processes: 1
      node_ids_to_pause_during_training:
        - 0
    evaluation:
      device_cycle:
        - 0
  lifecycle:
    replay:
      capacity:
        kind: constant
        value: 128
      maximum_capacity: 128
      maximum_policy_entries: 16
    credit:
      replay_ratio: 1
      optimizer_steps_per_quantum: 1
      maximum_optimizer_steps: 5
      retained_checkpoint_interval_generations: 1
    inference_retention:
      recent_checkpoint_count: 6
      milestone_interval: 1
  limits:
    hourly_price: 0.303
    maximum_cost: 0.10
    maximum_wall_time_seconds: 300
    maximum_open_file_count: 16384
    maximum_host_ram_percent: 90.0
    minimum_free_disk_gib: 5.0
    resource_telemetry_interval_seconds: 1.0
  random_seed: 1111
evaluation:
  cadence_seconds: 2
  job_timeout_seconds: 120
  shutdown_grace_seconds: 5
  bootstrap_samples: 100
  dataset:
    path: py/reference/vast-r11-chess-evaluation-v1.bin
    source: {kind: engine_self_play, random_seed: 1111, move_sampling_temperature: 1.0}
  openings:
    path: py/reference/vast-r11-chess-openings-v1.json
    opening_count: 1
    source: {kind: engine_beam, random_seed: 1111, expanded_actions_per_position: 3, beam_width: 81}
  engine:
    kind: stockfish
    executable_path: engines/stockfish
    label_nodes: 2
    match_nodes: 2
    threads: 1
    hash_mib: 16
    multi_pv: 3
    policy_softmax_temperature: 0.15
  definitions:
    - kind: fixed_dataset
      definition_id: fixed-dataset
    - kind: random
      definition_id: search-random
      maximum_game_plies: 16
      search: &evaluation_search
        searches_per_move: 2
        parallel_searches: 1
        exploration_constant: 1.0
        inference:
          inference_workers: 1
          inference_batch_size: 4
          outstanding_batches_per_worker: 1
    - kind: policy_random
      definition_id: policy-random
      maximum_game_plies: 16
    - kind: previous_checkpoint
      definition_id: previous-boundary
      boundary_offset: 1
      maximum_game_plies: 16
      search: *evaluation_search
    - kind: stockfish
      definition_id: stockfish-level-0
      skill_level: 0
      maximum_game_plies: 16
      search: *evaluation_search
chess:
  self_play:
    search:
      full_searches:
        kind: constant
        value: 8
      fast_searches:
        kind: constant
        value: 2
      parallel_searches: 1
      dirichlet_epsilon:
        kind: constant
        value: 0.25
      dirichlet_alpha:
        kind: constant
        value: 0.3
      exploration_constant:
        kind: constant
        value: 1.5
      fpu_reduction:
        kind: constant
        value: 0.0
      forced_playouts:
        kind: disabled
    inference:
      inference_workers: 1
      inference_batch_size: 8
      outstanding_batches_per_worker: 1
    start_position:
      kind: random_opening
      maximum_plies:
        kind: constant
        value: 0
    full_search_probability:
      kind: constant
      value: 1.0
    retained_root_visit_fraction:
      kind: constant
      value: 0.0
    greedy_after_ply:
      kind: constant
      value: 8
    maximum_game_plies:
      kind: constant
      value: 16
    starting_temperature:
      kind: constant
      value: 1.0
    final_temperature:
      kind: constant
      value: 0.1
    primary_sample_weight:
      kind: constant
      value: 1.0
    detailed_statistics_workers: 1
  objective:
    policy_loss_weight:
      kind: constant
      value: 1.0
    value_loss_weight:
      kind: constant
      value: 0.5
    root_value_blend:
      kind: constant
      value: 0.0
    auxiliary_targets: []
