# Four-day CNN production run (2026-08-23, replacing the attention attempt).
# Both attention runs (12x176 at gen ~25, 11x128 at gen ~106) plateaued at ladder Elo ~650 while the
# CNN plane head reached 846 within an hour — implementation-level attention problem, diagnosed
# separately. Same recipe and platform as vast-chess-4day-attention: r3 base + plane heads, Syzygy
# adjudication, compilation on, progressive sizing (promotions at 12 h and 1.5 d, loss-EMA gated),
# resignation from generation 70. Rung parameters: 1.34M -> 2.66M -> 5.06M (the middle rung is the
# validated exp1 trunk). Rung 1 sized per
# documentation/benchmarks/progressive-sizing-throughput-rtx4070super-20260823.
extends: vast-chess-8gpu-exp1-planehead.yaml

run:
  run_name: vast-chess-4day-cnn
  tensorboard_run_directory: vast-chess-4day-cnn

training:
  save_path: py/training_data/validation/vast-chess-4day-cnn
  trainer:
    compilation: default
  progressive_model_sizing:
    models:
      - model_id: chess-cnn-8x96
        training_start_days: 0.0
        network:
          kind: convolutional
          num_layers: 8
          hidden_size: 96
          residual_context: {kind: global_pooling, placement: every_second_block}
          policy_head: {kind: chess_76_plane_direct_v2}
          num_value_channels: 2
          value_fc_size: 48
      - model_id: chess-cnn-12x112
        training_start_days: 0.5
        network:
          kind: convolutional
          num_layers: 12
          hidden_size: 112
          residual_context: {kind: global_pooling, placement: every_second_block}
          policy_head: {kind: chess_76_plane_direct_v2}
          num_value_channels: 2
          value_fc_size: 48
      - model_id: chess-cnn-14x144
        training_start_days: 1.5
        network:
          kind: convolutional
          num_layers: 14
          hidden_size: 144
          residual_context: {kind: global_pooling, placement: every_second_block}
          policy_head: {kind: chess_76_plane_direct_v2}
          num_value_channels: 2
          value_fc_size: 48
  limits:
    hourly_price: 0.755
    maximum_cost: null
    maximum_wall_time_seconds: 345600
    manual_stop_file: /workspace/run-control/stop/vast-chess-4day-cnn.stop
    maximum_open_file_count: 49152
    maximum_host_ram_percent: 92.0
    minimum_free_disk_gib: 1.0
    resource_telemetry_interval_seconds: 5.0

