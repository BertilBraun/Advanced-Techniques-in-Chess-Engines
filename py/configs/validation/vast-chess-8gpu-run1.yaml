# Phase B Run 1 — "old recipe, new head" (recovery plan WP6 / section 3).
#
# r3's values (CNN 12x112 global pooling, optimizer, replay capacity/ratio 8, visit/fast/ply/greedy schedules,
# the two old auxiliary targets at the old weights, compilation disabled, no Syzygy, no adaptive budget) derived
# from documentation/images/four-day-analysis/training_args.txt and
# documentation/experiments/vast-chess-8-gpu-config.yaml (generations 0-149 slice); PLUS the new plane head,
# LR warm-up 1000 steps, fixed ingestion (WP2, code-side), mirror fix (WP1, code-side), the v1 evaluation
# dataset, the old evaluation definitions and the new fixed-node rungs 30/100/300/1000.
#
# Deliberately standalone (no extends): the previous cnn-reference replica failed exactly because it inherited
# the new stack through extends (regression analysis section 4.4).
#
# Keys owned by parallel Phase A streams that do not resolve until phase-a merges (marked WP1/WP3 below):
#   trainer.warmup_optimizer_steps, policy_head kind, staged parallel_searches, virtual_loss_weight,
#   per-definition nodes on stockfish_fixed_nodes.
game: chess
run:
  run_name: vast-chess-8gpu-run1
  tensorboard_run_directory: vast-chess-8gpu-run1
  stage: clean_retrain
  requires_explicit_approval: true
  resume:
    mode: random_initialization
  hardware:
    provider_name: vast.ai
    offer_id: unconfirmed  # PLACEHOLDER — node not rented yet; validation rejects 'unconfirmed' at start
    gpu_model: NVIDIA GeForce RTX 3090
    gpu_count: 8
    logical_cpu_count: 64
    minimum_ram_gib: 200
    minimum_disk_gib: 150
  environment:
    runtime_image: vastai/pytorch:cuda-13.0.3-auto
    python_version: '3.12'
    torch_version: 2.12.1+cu126
    cuda_version: '12.6'
    dependency_lock_path: py/requirements-training.lock
    dependency_lock_sha256: f027ad99a12742660107a2857b18cbc6b821a95971c2ecf2c4ad814c38116171
    minimum_open_file_soft_limit: 65536
training:
  save_path: py/training_data/validation/vast-chess-8gpu-run1
  trainer:
    global_batch_size: 2048
    local_batch_size: 256
    optimizer: adamw
    precision: bfloat16
    compilation: disabled
    learning_rate:
      kind: staged
      stages:
        - {start_generation: 0, value: 0.005}
        - {start_generation: 100, value: 0.0035}
        - {start_generation: 300, value: 0.002}
    warmup_optimizer_steps: 1000  # WP1 key — resolves after phase-a merge
    max_grad_norm: 0.5
    duplicate_multiplicity_weight_cap: null
  topology:
    trainer:
      device_type: cuda
      process_group_backend: nccl
      rank_zero_device_id: 0
      ddp_device_ids: [0, 1, 2, 3, 4, 5, 6, 7]
      cpu_threads: 4
      interop_threads: 1
    self_play:
      # PLACEHOLDER — node topology unknown: set processes per GPU and the paused-during-training set once the
      # node is rented. The string sentinels below fail resolution loudly on purpose.
      device_ids: PLACEHOLDER — node topology unknown
      parallel_games_per_process: 512
      tensorboard_processes: 1
      node_ids_to_pause_during_training: PLACEHOLDER — node topology unknown
    evaluation:
      device_cycle: [4, 5, 6, 7]
  lifecycle:
    replay:
      capacity:
        kind: linear
        start_generation: 0
        end_generation: 100
        start_value: 300000
        end_value: 2000000
        rounding: nearest
      maximum_capacity: 2000000
      maximum_policy_entries: 60
      materialization_processes: 8
    credit:
      replay_ratio: 8
      optimizer_steps_per_quantum: 500
      maximum_optimizer_steps: null
      retained_checkpoint_interval_generations: 6
      self_play_backpressure_quanta: 5
    inference_retention:
      recent_checkpoint_count: 22
      milestone_interval: 20
  limits:
    hourly_price: 0.0  # PLACEHOLDER — set with the rented offer; the approval must match
    maximum_cost: null
    maximum_wall_time_seconds: 14400
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-run1.stop
    maximum_open_file_count: 49152
    maximum_host_ram_percent: 92.0
    minimum_free_disk_gib: 20.0
    resource_telemetry_interval_seconds: 5.0
  random_seed: 20260811
  progressive_model_sizing:
    models:
      - model_id: chess-cnn-12x112
        training_start_days: 0.0
        network:
          kind: convolutional
          num_layers: 12
          hidden_size: 112
          residual_context: {kind: global_pooling, placement: every_second_block}
          # WP1 key — the new hidden-layer plane head; final kind name owned by the WP1 stream
          policy_head: {kind: chess_76_plane_direct_v2}
          num_value_channels: 2
          value_fc_size: 48
    promotion:  # inert with a single model
      decay: 0.8
      warmup_quanta: 10
      maximum_relative_loss: 1.01
evaluation:
  cadence_seconds: 1200
  job_timeout_seconds: 1800
  shutdown_grace_seconds: 30
  bootstrap_samples: 10000
  maximum_concurrent_jobs: 10
  dataset:
    path: /workspace/evaluation-artifacts/chess/chess-stockfish-evaluation-v1.bin
    source:
      kind: engine_self_play
      random_seed: 20260811
      move_sampling_temperature: 1.0
  openings:
    path: /workspace/evaluation-artifacts/chess/chess-stockfish-8moves-v3-openings-v1.json
    opening_count: 50
    source:
      kind: chess_book
      selection_path: py/reference/chess-stockfish-8moves-v3-openings-50.tsv
      selection_sha256: ec0fe73449d7ec6ff58db6b060d4c2535afef1d2cfdac098fb44b0cff22735b2
  engine:
    kind: stockfish
    executable_path: engines/stockfish
    label_nodes: 10000
    match_nodes: 1000
    threads: 1
    hash_mib: 1024
    multi_pv: 8
    policy_softmax_temperature: 0.15
  definitions:
    - kind: fixed_dataset
      definition_id: fixed-dataset
    - kind: previous_checkpoint
      definition_id: previous-20m
      boundary_offset: 1
      boundary_parity: every
      opening_pair_count: 50
      maximum_game_plies: 300
      search: &evaluation_search
        searches_per_move: 64
        parallel_searches: 1
        exploration_constant: 1.0
        inference:
          inference_workers: 1
          inference_batch_size: 64
          outstanding_batches_per_worker: 1
          sdpa_backend: memory_efficient
    - kind: previous_checkpoint
      definition_id: previous-40m
      boundary_offset: 2
      boundary_parity: every
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: previous_checkpoint
      definition_id: previous-60m
      boundary_offset: 3
      boundary_parity: every
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    # Levels 0 and 4 are kept only during the test runs for comparability with the four-day yardstick.
    - kind: stockfish
      definition_id: stockfish-level-0
      skill_level: 0
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish
      definition_id: stockfish-level-1
      skill_level: 1
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish
      definition_id: stockfish-level-2
      skill_level: 2
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish
      definition_id: stockfish-level-3
      skill_level: 3
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish
      definition_id: stockfish-level-4
      skill_level: 4
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    # New fixed-node rungs (WP3): per-definition node counts per the WP3 schema.
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-30
      nodes: 30
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-100
      nodes: 100
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-300
      nodes: 300
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-1000
      nodes: 1000
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
chess:
  self_play:
    resignation:
      kind: calibrated
      first_production_generation: 70
      false_nonloss_rate_ceiling: 0.03
      continuation_game_probability: 0.1
      triggered_game_window: 2000
      candidate_threshold_minimum: -0.99
      candidate_threshold_maximum: -0.7
      candidate_threshold_step: 0.01
      minimum_evidence_trigger_count: 100
      confidence_level: 0.95
      maximum_relaxation_per_generation: 0.01
    search:
      full_search_budget:
        kind: fixed
        visits:
          kind: staged
          stages:
            - {start_generation: 0, value: 200}
            - {start_generation: 10, value: 300}
            - {start_generation: 30, value: 400}
            - {start_generation: 50, value: 500}
            - {start_generation: 90, value: 600}
            - {start_generation: 180, value: 700}
            - {start_generation: 250, value: 800}
            - {start_generation: 550, value: 1000}
      fast_searches:
        kind: staged
        stages:
          - {start_generation: 0, value: 50}
          - {start_generation: 10, value: 75}
          - {start_generation: 30, value: 100}
          - {start_generation: 50, value: 125}
          - {start_generation: 90, value: 150}
      # WP3 keys — staged parallel searches (1 below 600 full-search visits, 4 from 600 on) and the
      # virtual-loss fraction resolve after phase-a merge.
      parallel_searches:
        kind: staged
        stages:
          - {start_generation: 0, value: 1}
          - {start_generation: 90, value: 4}
      virtual_loss_weight: 1.0
      dirichlet_epsilon: 0.25
      dirichlet_alpha: 0.3
      exploration_constant: 1.5
      first_play_urgency:
        kind: reduced_parent_value
        reduction: 0.2
      forced_playouts:
        kind: enabled
        coefficient: 1.5
    inference:
      inference_workers: 2
      inference_batch_size: 64
      outstanding_batches_per_worker: 2
      sdpa_backend: memory_efficient
    start_position:
      kind: restart_state
      true_start_probability: 0.5
      candidate_visit_mass: 0.85
      minimum_candidates: 2
      maximum_candidates: 3
      maximum_absolute_root_value: 0.8
      minimum_remaining_plies: 15
      maximum_archive_positions: 50000
      maximum_age_generations: 40
    full_search_probability:
      kind: linear
      start_generation: 0
      end_generation: 70
      start_value: 1.0
      end_value: 0.25
      rounding: none
    retained_root_visit_fraction: 0.6
    greedy_after_ply:
      kind: staged
      stages:
        - {start_generation: 0, value: 60}
        - {start_generation: 110, value: 80}
    maximum_game_plies:
      kind: staged
      stages:
        - {start_generation: 0, value: 150}
        - {start_generation: 50, value: 160}
        - {start_generation: 80, value: 180}
        - {start_generation: 110, value: 200}
        - {start_generation: 140, value: 250}
    force_fast_search_after_ply: 200
    starting_temperature: 1.3
    final_temperature: 0.1
    primary_sample_weight: 1.0
    detailed_statistics_workers: 1
  objective:
    policy_loss_weight: 1.0
    value_loss_weight: 1.0
    root_value_blend:
      kind: linear
      start_generation: 50
      end_generation: 110
      start_value: 0.0
      end_value: 0.15
      rounding: none
    value_discount_per_ply: 1.0
    auxiliary_targets:
      - kind: next_policy
        ply_offset: 1
        loss_weight: 0.1
      - kind: remaining_game_length
        loss_weight: 0.1
        normalization_scale: 400.0
