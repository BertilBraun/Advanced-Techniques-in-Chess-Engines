# Four-day production run (2026-08-24 midday) — the full decided package on the 1,880 encoding.
# Base recipe = the r3 replica (which tracked r3's curve shape); deliberate deltas, each validated:
#   dense head ch4 + bottleneck_rank 96 (207k params, ties the 483k baseline in the supervised
#     bake-off, benchmark-results/policy-heads-*.json), replay ratio 10 (A/B showed reuse
#     insensitivity 2 vs 16), r3's split search discount 0.99 restored (forensics), adaptive
#     budget with caps at 1.25x the r3 schedule (realized mean ~r3), virtual loss 0.5 to soften
#     parallel-search distortion, the two permanent aux targets + search_correction for the gate,
#     Syzygy adjudication and compilation on. Judged by wall-clock evaluation curves.
extends: vast-chess-4day-r3replica.yaml

run:
  run_name: vast-chess-4day-production
  tensorboard_run_directory: vast-chess-4day-production

training:
  save_path: py/training_data/validation/vast-chess-4day-production
  trainer:
    compilation: default
  lifecycle:
    credit:
      replay_ratio: 10
  progressive_model_sizing:
    models:
      - model_id: chess-cnn-12x128-dense4r96
        training_start_days: 0.0
        network:
          kind: convolutional
          num_layers: 12
          hidden_size: 128
          residual_context: {kind: global_pooling, placement: every_second_block}
          policy_head: {kind: dense, channels: 4, bottleneck_rank: 96}
          num_value_channels: 2
          value_fc_size: 48
      - model_id: chess-cnn-14x152-dense4r96
        training_start_days: 1.0
        network:
          kind: convolutional
          num_layers: 14
          hidden_size: 152
          residual_context: {kind: global_pooling, placement: every_second_block}
          policy_head: {kind: dense, channels: 4, bottleneck_rank: 96}
          num_value_channels: 2
          value_fc_size: 48
  limits:
    hourly_price: 0.755
    maximum_cost: null
    maximum_wall_time_seconds: 345600
    manual_stop_file: /workspace/run-control/stop/vast-chess-4day-production.stop
    maximum_open_file_count: 49152
    maximum_host_ram_percent: 92.0
    minimum_free_disk_gib: 1.0
    resource_telemetry_interval_seconds: 5.0

chess:
  self_play:
    search:
      virtual_loss_weight: 0.5
      full_search_budget:
        kind: adaptive
        minimum_visits: 200
        maximum_visits:
          kind: staged
          stages:
            - {start_generation: 0, value: 250}
            - {start_generation: 10, value: 375}
            - {start_generation: 30, value: 500}
            - {start_generation: 50, value: 625}
            - {start_generation: 90, value: 750}
            - {start_generation: 180, value: 875}
            - {start_generation: 250, value: 1000}
            - {start_generation: 550, value: 1250}
        observation_interval: 100
        leader_stability_window: 200
        root_value_tolerance: 0.04
        initial_top_visit_share: 0.7
        final_top_visit_share: 0.5
        initial_top_two_margin: 0.45
        final_top_two_margin: 0.15
        threshold_relaxation_visits: 1200
        learned_gate_start_generation: 50
        minimum_search_correction_to_unlock_tail: 0.4
  objective:
    search_value_discount_per_ply: 0.99
    auxiliary_targets:
      - kind: next_policy
        ply_offset: 1
        loss_weight: 0.1
      - kind: remaining_game_length
        loss_weight: 0.1
        normalization_scale: 400.0
      - kind: search_correction
        loss_weight: 0.05
