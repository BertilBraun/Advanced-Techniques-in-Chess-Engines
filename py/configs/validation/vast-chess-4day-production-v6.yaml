      forced_playouts:
        kind: enabled
        coefficient: 1.5
    inference:
      inference_workers: 1
      inference_batch_size: 320
      outstanding_batches_per_worker: 2
      sdpa_backend: memory_efficient
    start_position:
      kind: restart_state
      true_start_probability: 0.5
      candidate_visit_mass: 0.85
      minimum_candidates: 2
      maximum_candidates: 3
      maximum_absolute_root_value: 0.8
      minimum_remaining_plies: 15
      maximum_archive_positions: 50000
      maximum_age_generations: 40
    full_search_probability:
      kind: linear
      start_generation: 0
      end_generation: 70
      start_value: 1.0
      end_value: 0.25
      rounding: none
    retained_root_visit_fraction: 0.6
    greedy_after_ply:
      kind: staged
      stages:
        - {start_generation: 0, value: 60}
        - {start_generation: 110, value: 80}
    maximum_game_plies:
