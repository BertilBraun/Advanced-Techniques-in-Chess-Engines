          - {start_generation: 0, value: 50}
          - {start_generation: 10, value: 75}
          - {start_generation: 30, value: 100}
          - {start_generation: 50, value: 125}
          - {start_generation: 90, value: 150}
      parallel_searches:
        kind: staged
        stages:
          - {start_generation: 0, value: 2}
          - {start_generation: 90, value: 4}
      virtual_loss_weight: 1.0
      dirichlet_epsilon: 0.25
      dirichlet_alpha: 0.3
      exploration_constant: 1.5
      first_play_urgency:
