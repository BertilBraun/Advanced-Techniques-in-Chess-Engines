extends: ../production/vast-chess-8gpu-progressive-v36-int8.yaml

run:
  run_name: vast-chess-progressive-int8-lifecycle-smoke
  tensorboard_run_directory: vast-chess-progressive-int8-lifecycle-smoke
  stage: systems_pilot
  requires_explicit_approval: true

training:
  save_path: py/training_data/validation/vast-chess-progressive-int8-lifecycle-smoke
  trainer:
    global_batch_size: 8
    local_batch_size: 8
    warmup_optimizer_steps: 1
    quantization:
      kind: tensorrt_int8_qat
      fold_after_optimizer_steps: 1
      calibration_positions: 256
      recalibration_interval_generations: 1
      deployment_learning_rate: inherit
      deployment_warmup_optimizer_steps: 1
  topology:
    trainer:
      rank_zero_device_id: 7
      ddp_device_ids: [7]
    self_play:
      device_ids: [7]
      parallel_games_per_process: 32
      tensorboard_processes: 1
      node_ids_to_pause_during_training: []
    evaluation:
      device_cycle: [7]
  lifecycle:
    credit:
      replay_ratio: 1
      optimizer_steps_per_quantum: 1
      maximum_optimizer_steps: 30
      retained_checkpoint_interval_generations: 1
      self_play_backpressure_quanta: 2
  limits:
    maximum_wall_time_seconds: 600
    manual_stop_file: /workspace/run-control/stop/vast-chess-progressive-int8-lifecycle-smoke.stop
  progressive_model_sizing:
    candidate_start:
      kind: elapsed
      start_days: [0.0003]
    promotion:
      decay: 0.8
      warmup_quanta: 1
      maximum_relative_loss: 100.0
      candidate_catchup_learning_rate: 0.1

evaluation:
  cadence_seconds: 1
  maximum_concurrent_jobs: 1
  definitions:
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    node_ladder: [30, 100]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 1
    maximum_game_plies: 20
    first_generation: 1
    final_generation: null
    search: &int8_smoke_evaluation_search
      searches_per_move: 1
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          bootstrap_with_torchscript: true
          templates:
          - kind: qat
            model_id: chess-cnn-scaled-post-12x128-fromto-int8
            phase: deployment
            engine_path: /workspace/tensorrt/v36-int8-12x128-deployment-trained-eval64-template.engine
          - kind: qat
            model_id: chess-cnn-scaled-post-14x160-fromto-int8
            phase: deployment
            engine_path: /workspace/tensorrt/v36-int8-14x160-deployment-trained-eval64-template.engine
        sdpa_backend: memory_efficient
