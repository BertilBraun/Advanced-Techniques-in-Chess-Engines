# Phase B Run 2 — "everything on" (recovery plan WP6 / section 3): Run 1 plus the six auxiliary targets at the
# optimal weights, adaptive search budget, Syzygy adjudication, early termination, replay ratio 10,
# compilation default and the v2 evaluation dataset (v1-era match definitions are inherited unchanged).
# Progressive sizing stays off. Trunk: CNN 12x144 now; attention only if WP4 passes (open decision).
#
# Inherits the topology and hourly-price placeholders from Run 1 — fill both when the node is rented.
# Additional key owned by a parallel stream (marked WP3 below): chess.self_play.early_termination.
extends: vast-chess-8gpu-run1.yaml

run:
  run_name: vast-chess-8gpu-run2
  tensorboard_run_directory: vast-chess-8gpu-run2

training:
  save_path: py/training_data/validation/vast-chess-8gpu-run2
  trainer:
    compilation: default
  lifecycle:
    credit:
      replay_ratio: 10
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-run2.stop
  progressive_model_sizing:
    models:
      - model_id: chess-cnn-12x144
        training_start_days: 0.0
        network:
          kind: convolutional
          num_layers: 12
          hidden_size: 144
          residual_context: {kind: global_pooling, placement: every_second_block}
          # WP1 key — the new hidden-layer plane head; final kind name owned by the WP1 stream
          policy_head: {kind: chess_76_plane_direct_v2}
          num_value_channels: 2
          value_fc_size: 48

evaluation:
  dataset:
    path: /workspace/evaluation-artifacts/chess/chess-stockfish-direct-policy-evaluation-v2.bin
  openings:
    path: /workspace/evaluation-artifacts/chess/chess-stockfish-8moves-v3-direct-policy-openings-v2.json

chess:
  self_play:
    search:
      # Adaptive budget parameters carried from the last committed adaptive configuration (61d31c45 /
      # e48b0376^) with the maximum-visit schedule matched to Run 1's fixed schedule; open decision.
      full_search_budget:
        kind: adaptive
        minimum_visits: 200
        maximum_visits:
          kind: staged
          stages:
            - {start_generation: 0, value: 200}
            - {start_generation: 10, value: 300}
            - {start_generation: 30, value: 400}
            - {start_generation: 50, value: 500}
            - {start_generation: 90, value: 600}
            - {start_generation: 180, value: 700}
            - {start_generation: 250, value: 800}
            - {start_generation: 550, value: 1000}
        observation_interval: 100
        leader_stability_window: 200
        root_value_tolerance: 0.04
        initial_top_visit_share: 0.7
        final_top_visit_share: 0.5
        initial_top_two_margin: 0.45
        final_top_two_margin: 0.15
        threshold_relaxation_visits: 1200
        learned_gate_start_generation: 50
        minimum_search_correction_to_unlock_tail: 0.4
    # WP3 key — early termination with material-heuristic/Syzygy adjudication and censored
    # remaining-game-length targets on cut games; ply values are a proposal, resolves after phase-a merge.
    early_termination:
      maximum_game_plies:
        kind: staged
        stages:
          - {start_generation: 0, value: 80}
          - {start_generation: 20, value: 120}
          - {start_generation: 40, value: 150}
      censor_remaining_game_length_target: true
  objective:
    auxiliary_targets:
      - kind: next_policy
        ply_offset: 1
        loss_weight: 0.05
      - kind: remaining_game_length
        loss_weight: 0.025
        normalization_scale: 200.0
      - kind: future_search_value
        ply_offset: 4
        smooth_l1_beta: 0.1
        loss_weight: 0.025
      - kind: irreversible_progress
        horizon_plies: 16
        loss_weight: 0.0125
      - kind: legal_moves
        loss_weight: 0.0125
      - kind: search_correction
        loss_weight: 0.05
