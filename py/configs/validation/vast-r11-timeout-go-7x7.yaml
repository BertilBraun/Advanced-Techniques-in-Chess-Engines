game: go
run:
  run_name: vast-r11-timeout-go-7x7
  tensorboard_run_directory: vast-r11-timeout-go-7x7
  stage: systems_pilot
  requires_explicit_approval: true
  resume:
    mode: random_initialization
  hardware:
    provider_name: vast.ai
    offer_id: instance-47261298-host-95290
    gpu_model: NVIDIA GeForce RTX 3060
    gpu_count: 1
    logical_cpu_count: 32
    minimum_ram_gib: 32
    minimum_disk_gib: 20
  environment:
    runtime_image: vastai/pytorch:cuda-13.0.3-auto
    python_version: '3.12'
    torch_version: 2.12.1+cu126
    cuda_version: '12.6'
    dependency_lock_path: py/requirements-training.lock
    dependency_lock_sha256: f027ad99a12742660107a2857b18cbc6b821a95971c2ecf2c4ad814c38116171
    minimum_open_file_soft_limit: 32768
training:
  save_path: py/training_data/validation/vast-r11-timeout-go-7x7
  network:
    num_layers: 2
    hidden_size: 32
    residual_context:
      kind: squeeze_excitation
      placement: every_second_block
    policy_head: {kind: dense, channels: 2}
    num_value_channels: 1
    value_fc_size: 16
  trainer:
    global_batch_size: 8
    local_batch_size: 8
    optimizer: adamw
    precision: float32
    compilation: disabled
    learning_rate: 0.001
    max_grad_norm: 0.5
    duplicate_multiplicity_weight_cap: null
  topology:
    trainer:
      device_type: cuda
      process_group_backend: nccl
      rank_zero_device_id: 0
      ddp_device_ids: [0]
      cpu_threads: 4
      interop_threads: 1
    self_play:
      device_ids: [0]
      parallel_games_per_process: 4
      tensorboard_processes: 1
      node_ids_to_pause_during_training: [0]
    evaluation:
      device_cycle: [0]
  lifecycle:
    replay:
      capacity: 128
      maximum_capacity: 128
      maximum_policy_entries: 16
    credit:
      replay_ratio: 1
      optimizer_steps_per_quantum: 1
      maximum_optimizer_steps: 500
      retained_checkpoint_interval_generations: 1
      self_play_backpressure_quanta: 5
    inference_retention:
      recent_checkpoint_count: 6
      milestone_interval: 1
  limits:
    hourly_price: 0.303
    maximum_cost: 0.01
    maximum_wall_time_seconds: 30
    maximum_open_file_count: 16384
    maximum_host_ram_percent: 90.0
    minimum_free_disk_gib: 5.0
    resource_telemetry_interval_seconds: 1.0
  random_seed: 1107
evaluation:
  cadence_seconds: 2
  job_timeout_seconds: 30
  shutdown_grace_seconds: 5
  bootstrap_samples: 100
  dataset:
    path: py/reference/vast-r11-go-7x7-evaluation-v2.bin
    source:
      kind: engine_self_play
      random_seed: 1107
      move_sampling_temperature: 2.0
  openings:
    path: py/reference/vast-r11-go-7x7-openings-v2.json
    opening_count: 1
    source:
      kind: engine_beam
      random_seed: 1107
      expanded_actions_per_position: 3
      beam_width: 81
  engine:
    kind: katago
    executable_path: engines/katago
    model_path: engines/katago.bin.gz
    analysis_configuration_path: engines/katago-analysis.cfg
    label_max_visits: 16
  definitions:
    - kind: fixed_dataset
      definition_id: fixed-dataset
    - kind: random
      definition_id: search-random
      maximum_game_plies: 16
      search: &evaluation_search
        searches_per_move: 2
        parallel_searches: 1
        exploration_constant: 1.0
        inference:
          inference_workers: 1
          inference_batch_size: 4
          outstanding_batches_per_worker: 1
    - kind: policy_random
      definition_id: policy-random
      maximum_game_plies: 16
    - kind: previous_checkpoint
      definition_id: previous-boundary
      boundary_offset: 1
      maximum_game_plies: 16
      search: *evaluation_search
    - kind: katago
      definition_id: katago
      maximum_visits: 2
      maximum_game_plies: 16
      search: *evaluation_search
go:
  self_play:
    search:
      full_searches: 8
      fast_searches: 2
      parallel_searches: 1
      dirichlet_epsilon: 0.25
      dirichlet_alpha: 0.3
      exploration_constant: 1.5
      first_play_urgency:
        kind: zero
      forced_playouts:
        kind: disabled
    inference:
      inference_workers: 1
      inference_batch_size: 8
      outstanding_batches_per_worker: 1
    start_position:
      kind: random_opening
      maximum_plies: 0
    full_search_probability: 1.0
    retained_root_visit_fraction: 0.0
    greedy_after_ply: 8
    starting_temperature: 1.0
    final_temperature: 0.1
    primary_sample_weight: 1.0
    detailed_statistics_workers: 1
  rules:
    komi_half_points: 15
    maximum_moves: 98
  representation:
    board_size: 7
    history_length: 8
    binary_channel_count: 16
    scalar_channel_count: 1
    canonical_player_perspective: true
  objective:
    policy_loss_weight: 1.0
    value_loss_weight: 1.0
    root_value_blend: 0.0
    value_discount_per_ply: 1.0
    auxiliary_targets: []
