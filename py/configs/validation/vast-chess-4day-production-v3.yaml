chess:
  self_play:
    maximum_ply_syzygy_paths:
      - /workspace/syzygy/wdl345
    resignation:
      kind: calibrated
      first_production_generation: 70
      false_nonloss_rate_ceiling: 0.03
      continuation_game_probability: 0.1
      triggered_game_window: 2000
      candidate_threshold_minimum: -0.99
      candidate_threshold_maximum: -0.7
      candidate_threshold_step: 0.01
      minimum_evidence_trigger_count: 100
      confidence_level: 0.95
      maximum_relaxation_per_generation: 0.01
    search:
      full_search_budget:
        kind: adaptive
        minimum_visits: 200
        maximum_visits:
          kind: staged
          stages:
            - {start_generation: 0, value: 250}
            - {start_generation: 10, value: 375}
            - {start_generation: 30, value: 500}
