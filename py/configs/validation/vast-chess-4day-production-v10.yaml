# Four-day production v10 (2026-08-27) — schedule, inference and evaluation deltas on top of v9.
#
# Extends v9, so the diff is the whole content of this file. The v9 baseline-visit schedule and the
# settled learned-budget lifecycle defaults are inherited. This file adds the scalar target at weight
# 0.2 while preserving the newer v10 model, replay, inference, and evaluation changes. hardware.offer_id
# is inherited and must be updated to the node actually rented.
#
# Learning rate — retain v9's observed 0.005 -> 0.004 -> 0.0034 path through generation 500, then
# decay in measured stages to 0.0015 at generation 1500. V9's 15% drops at generations 500 and 600
# modestly improved the training-loss slope and stabilised value loss, but fixed-dataset quality did
# not improve and playing strength showed no clear inflection. The evidence supports gradual cooling,
# not the previously authored 10x geometric decay to 0.0005. This 3.33x total decay keeps v10 near the
# learning-rate range in which v9 was still gaining strength at generation 632 while continuing to
# reduce update size through days three and four. At v9's observed ~18.5 generations/hour, generation
# 1500 falls at ~81 h, inside a four-day run; the schedule holds 0.0015 as a floor beyond it.
#
# Self-play inference uses the measured RTX 4070 SUPER winner: bf16 channels-last with cuDNN
# benchmarking. It passed the trained-checkpoint agreement gate and improved end-to-end searches/s
# by 1.168x. Evaluation keeps v9's inference layout because its batch size 64 path was not measured.
#
# Progressive sizing is restated in full because lists replace wholesale. Two changes against v9.
#
# Rungs are 12x128 -> 14x160 -> 19x176: depth rises 12/14/19 and width 128/160/176, and every width
# was measured efficient on the RTX 4070 SUPER. 152 channels, which v9 used at rung 2, sits in a
# throughput trough: at matched depth it delivers 0.72 of what its own arithmetic implies, against
# 1.00 for 128, 0.92 for 160 and 0.94 for 176. 14x160 is measured faster than v9's 14x152 at both
# production batch sizes -- 1.048x at the self-play batch of 320 and 1.013x at the evaluation batch of
# 64 -- while carrying 10.8% more trunk parameters.
#
# Rungs 2 and 3 match v9's training parameter count to within 4% once the smaller head is accounted
# for. Rung 1 deliberately does not: restoring its parameters needs 10x160, which costs 28% of
# self-play throughput (69,000 against 95,833 positions/s at batch 320) to buy capacity during the
# run's most data-bound phase, where the distillation probe measured parameters as worth approximately
# nothing. Rung 1's job is to generate games quickly.
#
# Depth is the expensive axis at production batch sizes. At the evaluation batch of 64 throughput is
# close to 213,000/layers regardless of width, so shapes that looked good at batch 512 invert: 20x128
# is 1.36x of 14x152 at batch 512 and 0.73x at batch 64. Any future rung change should be measured at
# 320 and 64, never at 512. See documentation/benchmarks/chess-attention-viability-rtx3060-20260827.
#
# All three rungs take the from-to policy head instead of the dense one. It scores every action as the
# attention logit from its origin square's query to its target square's key, which the 1,880-way
# (from, to, promotion) encoding is already an enumeration of. Measured supervised on 6M distilled
# positions at matched trunk: 0.0298 nats better held-out policy cross-entropy [0.0285, 0.0311],
# roughly +33 to +42 Elo, for 51,072 head parameters against 483,680 and 1.9% of forward throughput.
# The auxiliary next-policy head shrinks with it, so a rung's training parameter count drops about 20%.
#
# The head has never run a self-play generation. The supervised evidence is 8,000 steps against the
# specified 80,000, and the convolutional head gain was still shrinking with training length at that
# point, so treat the per-generation yardstick as the gate: generation 20 prev-20m >= 0.65 and
# generation 50 fixed top-1 >= 0.27 with Stockfish level 0 >= 0.5 would catch a bad head in about
# three hours.
#
# Replay capacity. v9 ramped linearly 300k -> 2M over generations 0-100 and then held 2M flat for the
# remaining ~95% of the run: a fixed window of ~15.6 generations of history against ~128k positions
# generated per generation. v10 keeps generations 0-100 within a few percent of v9's ramp and lands
# on exactly 2.0M at generation 100 — so the v9 yardstick comparison stays valid through the entire
# region for which data exists — except for a tighter first ten generations, which flushes random
# play faster. Past generation 100 the window grows stepwise and sublinearly to 5M, deliberately
# slowly, because a larger window admits older and weaker games. maximum_capacity rises 2M -> 5M,
# which sizes the preallocated replay file: confirm the on-disk footprint against minimum_disk_gib
# before launching.
#
# Auxiliary policy weight 0.1 -> 0.15, matching KataGo's w_opp for the same opponent-reply target
# (arXiv:1902.10565 section 3.4). remaining_game_length stays at 0.1; KataGo publishes no comparable
# number for it.
#
# Evaluation. Definitions are a list, so they replace wholesale and are restated in full. Two changes
# against v9: a Stockfish rung at 100 nodes against the standard 64 model searches, and three
# raw-policy rungs at 30 / 100 / 300 nodes with one search per move. Policy-only strength is the
# network's own contribution with search removed; tracked beside the 64-search ladder it separates a
# network improvement from a search improvement, and it reuses the already-calibrated low rungs
# because that calibration is what turns a policy-only score into a ladder Elo. Rung 1000 is omitted
# for policy-only: it has no prospect there and those games would be wasted.
#
# The evaluation exploration constant is `auto`, which evaluates AlphaZero's visit-scaled PUCT
# formula once at each rung's configured search budget: 1.2501 at one search, 1.2533 at 64. The
# constants 19652 and 1.25 live in code, not here.
#
# NOTE ON COMPARABILITY: v10 changes the measuring instrument in two ways. Evaluation now inherits
# the self-play first-play urgency instead of the hardcoded zero it used through v9, and the
# exploration constant moves from a flat 1.0 to AlphaZero's formula. Both are justified separately —
# offline evidence for the first, removing a magic number for the second — but they compound, so
# every number in the per-generation yardstick shifts and its generation-20 and generation-50
# thresholds must be re-baselined against this run before they are applied again.
extends: vast-chess-4day-production-v9.yaml
run:
  run_name: vast-chess-4day-production-v10
  tensorboard_run_directory: vast-chess-4day-production-v10
training:
  save_path: py/training_data/validation/vast-chess-4day-production-v10
  trainer:
    learning_rate:
      kind: staged
      stages:
        - {start_generation: 0, value: 0.005}
        - {start_generation: 100, value: 0.004}
        - {start_generation: 500, value: 0.0034}
        - {start_generation: 700, value: 0.0029}
        - {start_generation: 900, value: 0.00245}
        - {start_generation: 1100, value: 0.0021}
        - {start_generation: 1300, value: 0.0018}
        - {start_generation: 1500, value: 0.0015}
  lifecycle:
    replay:
      capacity:
        kind: staged
        stages:
          - {start_generation: 0, value: 150000}
          - {start_generation: 5, value: 300000}
          - {start_generation: 10, value: 500000}
          - {start_generation: 20, value: 700000}
          - {start_generation: 40, value: 1000000}
          - {start_generation: 70, value: 1500000}
          - {start_generation: 100, value: 2000000}
          - {start_generation: 400, value: 2600000}
          - {start_generation: 700, value: 3200000}
          - {start_generation: 1000, value: 4000000}
          - {start_generation: 1300, value: 5000000}
      maximum_capacity: 5000000
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-4day-production-v10.stop
  progressive_model_sizing:
    models:
      - model_id: chess-cnn-12x128-fromto
        training_start_days: 0.0
        network:
          kind: convolutional
          num_layers: 12
          hidden_size: 128
          residual_context: {kind: global_pooling, placement: every_second_block}
          policy_head: {kind: chess_from_to_attention_v1, key_size: 128}
          num_value_channels: 2
          value_fc_size: 48
      - model_id: chess-cnn-14x160-fromto
        training_start_days: 0.667
        network:
          kind: convolutional
          num_layers: 14
          hidden_size: 160
          residual_context: {kind: global_pooling, placement: every_second_block}
          policy_head: {kind: chess_from_to_attention_v1, key_size: 128}
          num_value_channels: 2
          value_fc_size: 48
      - model_id: chess-cnn-19x176-fromto
        training_start_days: 2.0
        network:
          kind: convolutional
          num_layers: 19
          hidden_size: 176
          residual_context: {kind: global_pooling, placement: every_second_block}
          policy_head: {kind: chess_from_to_attention_v1, key_size: 128}
          num_value_channels: 2
          value_fc_size: 48
    promotion:
      decay: 0.8
      warmup_quanta: 10
      maximum_relative_loss: 1.01
chess:
  self_play:
    inference:
      precision: bfloat16
      memory_format: channels_last
      cudnn_benchmark: true
  objective:
    auxiliary_targets:
      - kind: next_policy
        ply_offset: 1
        loss_weight: 0.15
      - kind: remaining_game_length
        loss_weight: 0.1
        normalization_scale: 400.0
      - kind: search_budget
        loss_weight: 0.2
evaluation:
  maximum_concurrent_jobs: 16
  definitions:
    - kind: fixed_dataset
      definition_id: fixed-dataset
    - kind: previous_checkpoint
      definition_id: previous-20m
      boundary_offset: 1
      boundary_parity: every
      opening_pair_count: 50
      maximum_game_plies: 300
      search: &evaluation_search
        searches_per_move: 64
        parallel_searches: 1
        exploration_constant: auto
        inference:
          inference_workers: 1
          inference_batch_size: 64
          outstanding_batches_per_worker: 1
          sdpa_backend: memory_efficient
    - kind: previous_checkpoint
      definition_id: previous-40m
      boundary_offset: 2
      boundary_parity: every
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: previous_checkpoint
      definition_id: previous-60m
      boundary_offset: 3
      boundary_parity: every
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-30
      final_generation: 200
      nodes: 30
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-100
      final_generation: 250
      nodes: 100
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-300
      final_generation: 450
      nodes: 300
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-1000
      final_generation: 900
      nodes: 1000
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-2000
      first_generation: 250
      nodes: 2000
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-3000
      first_generation: 300
      nodes: 3000
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-5000
      first_generation: 600
      nodes: 5000
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-fixed-nodes-10000
      first_generation: 1000
      nodes: 10000
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *evaluation_search
    # Raw-policy rungs: one search per move, so the reported strength is the network alone.
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-policy-only-30
      final_generation: 300
      nodes: 30
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: &policy_only_search
        searches_per_move: 1
        parallel_searches: 1
        exploration_constant: auto
        inference:
          inference_workers: 1
          inference_batch_size: 64
          outstanding_batches_per_worker: 1
          sdpa_backend: memory_efficient
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-policy-only-100
      final_generation: 800
      nodes: 100
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *policy_only_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-policy-only-300
      first_generation: 150
      nodes: 300
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *policy_only_search
    - kind: stockfish_fixed_nodes
      definition_id: stockfish-policy-only-1000
      first_generation: 600
      nodes: 1000
      engine_executable_path: engines/stockfish-13
      opening_pair_count: 50
      maximum_game_plies: 300
      search: *policy_only_search
