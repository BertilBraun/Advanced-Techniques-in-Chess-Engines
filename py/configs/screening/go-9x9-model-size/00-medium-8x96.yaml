extends: ../../baselines/vast-go-9x9-2gpu-4h.yaml
run:
  run_name: go9-model-size-00-medium-8x96
  tensorboard_run_directory: go9-model-size-00-medium-8x96
training:
  save_path: py/training_data/screening/go9-model-size/00-medium-8x96
  progressive_model_sizing:
    models:
      - model_id: go9-model-size-medium-8x96
        training_start_days: 0.0
        network:
          num_layers: 8
          hidden_size: 96
          residual_context:
            kind: squeeze_excitation
            placement: every_second_block
          policy_head: {kind: go_point_pass_v1}
          num_value_channels: 1
          value_fc_size: 32
