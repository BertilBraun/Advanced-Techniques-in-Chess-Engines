extends: ../production/vast-chess-8gpu-v97-revert-promotion.yaml

# Lc0 teacher diagnostic: the V97 recipe, served through TorchScript in float32 for every arm. The wrapped
# Lc0 teacher cannot run in bfloat16 (its converted graph keeps float32 constants), so checkpoint 1026 and
# the distilled student are served the same way to keep the arms matched; nothing else changes.
run:
  run_name: lc0-teacher-diagnostic
  tensorboard_run_directory: lc0-teacher-diagnostic

chess:
  self_play:
    inference:
      backend:
        kind: torchscript
      precision: float32
