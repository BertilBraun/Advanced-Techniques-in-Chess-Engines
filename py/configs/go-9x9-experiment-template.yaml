game: go
run:
  run_name: go-9x9-template
  tensorboard_run_directory: go-9x9-template
  stage: clean_retrain
  requires_explicit_approval: true
  resume: {mode: random_initialization}
  hardware: {provider_name: local, offer_id: local, gpu_model: unconfirmed, gpu_count: 1, logical_cpu_count: 8, minimum_ram_gib: 8, minimum_disk_gib: 1}
  environment:
    runtime_image: local
    python_version: "3.12"
    torch_version: "2.12.1+cu126"
    cuda_version: "12.6"
    dependency_lock_path: py/requirements-training.lock
    dependency_lock_sha256: f027ad99a12742660107a2857b18cbc6b821a95971c2ecf2c4ad814c38116171
    minimum_open_file_soft_limit: 1024
training:
  save_path: py/training_data/go-9x9
  network: {num_layers: 8, hidden_size: 96, se_placement: every_second_block, num_policy_channels: 2, num_value_channels: 1, value_fc_size: 32}
  trainer:
    global_batch_size: 256
    local_batch_size: 256
    optimizer: adamw
    learning_rate: {kind: constant, value: 0.002}
  topology:
    trainer: {device_type: cpu, process_group_backend: gloo, rank_zero_device_id: 0, ddp_device_ids: [0], cpu_threads: 1, interop_threads: 1}
    self_play: {device_ids: [0], parallel_games_per_process: 8, tensorboard_processes: 1, node_ids_to_pause_during_training: []}
    evaluation: {device_cycle: [0]}
  lifecycle:
    replay: {capacity: {kind: linear, start_generation: 0, end_generation: 200, start_value: 100000, end_value: 2500000, rounding: nearest}, maximum_capacity: 2500000, maximum_policy_entries: 82}
    credit: {replay_ratio: 8, optimizer_steps_per_quantum: 100, maximum_optimizer_steps: 100000, retained_checkpoint_interval_generations: 1}
    inference_retention: {recent_checkpoint_count: 11, milestone_interval: 10}
  limits: {hourly_price: 1.0, maximum_wall_time_seconds: 21600, maximum_open_file_count: 32768, maximum_host_ram_percent: 95.0, minimum_free_disk_gib: 0.1, resource_telemetry_interval_seconds: 5.0}
  random_seed: 0
evaluation:
  cadence_seconds: 1200
  job_timeout_seconds: 1200
  shutdown_grace_seconds: 30
  bootstrap_samples: 10000
  maximum_concurrent_jobs: 10
  dataset: {path: py/reference/go-9x9-evaluation-v1.bin, random_seed: 0, move_sampling_temperature: 1.0}
  openings: {path: py/reference/go-9x9-openings-v1.json, random_seed: 0, opening_count: 50, expanded_actions_per_position: 8, beam_width: 512}
  engine: {kind: katago, executable_path: engines/katago, model_path: engines/katago.bin.gz, analysis_configuration_path: engines/katago-analysis.cfg, label_max_visits: 256}
  definitions:
    - kind: fixed_dataset
      definition_id: fixed-dataset
    - kind: previous_checkpoint
      definition_id: previous-20m
      boundary_offset: 1
      maximum_game_plies: 324
      search: &evaluation_search
        searches_per_move: 96
        parallel_searches: 1
        exploration_constant: 1.0
        inference:
          inference_workers: 1
          inference_batch_size: 64
          outstanding_batches_per_worker: 1
    - kind: previous_checkpoint
      definition_id: previous-40m
      boundary_offset: 2
      maximum_game_plies: 324
      search: *evaluation_search
    - kind: previous_checkpoint
      definition_id: previous-60m
      boundary_offset: 3
      maximum_game_plies: 324
      search: *evaluation_search
    - kind: katago
      definition_id: katago-64
      maximum_visits: 64
      maximum_game_plies: 324
      search: *evaluation_search
go:
  self_play:
    search: {full_searches: {kind: constant, value: 256}, fast_searches: {kind: constant, value: 64}, parallel_searches: 2, dirichlet_epsilon: {kind: constant, value: 0.25}, dirichlet_alpha: {kind: constant, value: 0.3}, exploration_constant: {kind: constant, value: 1.5}, minimum_root_visits: {kind: constant, value: 0}}
    inference: {inference_workers: 1, inference_batch_size: 64, outstanding_batches_per_worker: 2}
    maximum_random_opening_plies: {kind: constant, value: 0}
    full_search_probability: {kind: constant, value: 1.0}
    retained_root_visit_fraction: {kind: constant, value: 0.0}
    greedy_after_ply: {kind: constant, value: 60}
    starting_temperature: {kind: constant, value: 1.0}
    final_temperature: {kind: constant, value: 0.1}
    primary_sample_weight: {kind: constant, value: 1.0}
  rules: {komi_half_points: 15, maximum_moves: 324}
  representation: {board_size: 9, history_length: 8, binary_channel_count: 16, scalar_channel_count: 1, canonical_player_perspective: true}
  objective: {policy_loss_weight: {kind: constant, value: 1.0}, value_loss_weight: {kind: constant, value: 1.0}, root_value_blend: {kind: constant, value: 0.0}, auxiliary_targets: []}
