extends: vast-chess-8gpu-v77-v35-progressive-prefold-int8-adamw008.yaml

run:
  run_name: vast-chess-8gpu-v87-v35-progressive-int8-sgd-reuse4-ladder
  tensorboard_run_directory: vast-chess-8gpu-v87-v35-progressive-int8-sgd-reuse4-ladder
  resume:
    mode: random_initialization

training:
  save_path: py/training_data/production/vast-chess-8gpu-v87-v35-progressive-int8-sgd-reuse4-ladder
  trainer:
    optimizer:
      kind: sgd
      momentum: 0.9
      weight_decay: 0.0001
      nesterov: true
    learning_rate:
      kind: linear
      start_generation: 0
      end_generation: 1000
      start_value: 0.1
      end_value: 0.01
      rounding: none
    max_grad_norm: 1.0
  lifecycle:
    credit:
      replay_ratio: 4
  progressive_model_sizing:
    # The staged Elo plateau gate never opened in any run: V79 measured 30 Elo/h against a 12.0
    # threshold, so every progressive run so far was single-stage. Elapsed starts fire regardless.
    candidate_start:
      kind: elapsed
      start_days: [0.02, 0.05]
    promotion:
      candidate_catchup_learning_rate: 0.1
  limits:
    maximum_cost: null
    maximum_wall_time_seconds: 7800
    minimum_free_disk_gib: 5.0
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v87-v35-progressive-int8-sgd-reuse4-ladder.stop

evaluation:
  cadence_seconds: 1200
  maximum_concurrent_jobs: 16
  definitions:
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    bracket_rungs: 3
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 1
    final_generation: null
    search: &v87_evaluation_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          bootstrap_with_torchscript: true
          allow_fidelity_deviation: true
          templates:
          - {kind: qat, model_id: chess-cnn-scaled-post-12x128-fromto-int8, phase: pre_fold, engine_path: /workspace/tensorrt/v75-int8-12x128-prefold-eval64-template.engine}
          - {kind: qat, model_id: chess-cnn-scaled-post-14x160-fromto-int8, phase: pre_fold, engine_path: /workspace/tensorrt/v35-int8-14x160-prefold-eval-template.engine}
          - {kind: qat, model_id: chess-cnn-scaled-post-19x176-fromto-int8, phase: pre_fold, engine_path: /workspace/tensorrt/v48-19x176-prefold-fp16-b64.engine}
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    bracket_rungs: 3
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 1
    final_generation: null
    search:
      <<: *v87_evaluation_search
      searches_per_move: 1
