extends: vast-chess-8gpu-integrated-v35.yaml

run:
  run_name: vast-chess-8gpu-integrated-v35-int8-candidate
  tensorboard_run_directory: vast-chess-8gpu-integrated-v35-int8-candidate

training:
  save_path: py/training_data/production/vast-chess-8gpu-integrated-v35-int8-candidate
  trainer:
    compilation: disabled
    quantization:
      kind: tensorrt_int8_qat
      fold_after_optimizer_steps: 1000
      calibration_positions: 256
      recalibration_interval_generations: 1
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-integrated-v35-int8-candidate.stop
  progressive_model_sizing:
    kind: fixed
    model:
      model_id: chess-cnn-scaled-post-14x160-fromto-int8
      network:
        kind: convolutional
        num_layers: 14
        hidden_size: 160
        residual_block:
          kind: scaled_post_activation
          branch_scale: 0.2672612419124244
          activation_cap: 6.0
        residual_context:
          kind: global_pooling
          placement: every_second_block
        policy_head:
          kind: chess_from_to_attention_v1
          key_size: 128
        num_value_channels: 2
        value_fc_size: 48

chess:
  self_play:
    inference:
        backend:
          kind: tensorrt
          template_engine_paths:
          - /workspace/tensorrt/v35-int8-14x160-generation0-template.engine
          - /workspace/tensorrt/v35-int8-14x160-prefold-template.engine
          - /workspace/tensorrt/v35-int8-14x160-deployment-template.engine

evaluation:
  definitions:
  - kind: fixed_dataset
    definition_id: fixed-dataset
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search: &int8_evaluation_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          template_engine_paths:
          - /workspace/tensorrt/v35-int8-14x160-prefold-eval-template.engine
          - /workspace/tensorrt/v35-int8-14x160-deployment-eval-template.engine
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search:
      <<: *int8_evaluation_search
      searches_per_move: 1
