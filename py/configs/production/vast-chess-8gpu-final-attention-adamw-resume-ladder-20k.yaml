# The AdamW attention run resumed with a 20,000-node rung above the searched ladder's 10,000. Around generation
# 650 the 10x192 scores ~0.88 against 3,000 nodes, ~0.72 against 5,000 and ~0.45 against 10,000, the top rung, so
# the bracket was pinned at 3,000/5,000/10,000 with its lowest rung nearly saturated: one off match there moved the
# fit by ~90 Elo (2,459 -> 2,369 at generations 653 and 658). With 20,000 (anchor 2,700, already in ladder.py) the
# bracket around the selected 10,000 becomes 5,000/10,000/20,000. The policy-only ladder (bracket around 1,000)
# is unchanged. Lists replace wholesale, so all three definitions are restated.
extends: vast-chess-8gpu-final-attention-adamw-resume-290.yaml

run:
  run_name: vast-chess-8gpu-final-attention-adamw-resume-ladder-20k
  tensorboard_run_directory: vast-chess-8gpu-final-attention-adamw-resume-ladder-20k
  resume:
    mode: checkpoint
    checkpoint_manifest_path: py/training_data/production/vast-chess-8gpu-final-attention-adamw/checkpoint_666.json
    generation: 666

training:
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-final-attention-adamw-resume-ladder-20k.stop

evaluation:
  definitions:
  - opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 1
    final_generation: null
    kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000, 20000]
    initial_nodes: 30
    retreat_score_threshold: 0.3
    advance_score_threshold: 0.7
    bracket_rungs: 3
    engine_executable_path: engines/stockfish-13
    search: &searched_ladder_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        sdpa_backend: memory_efficient
        backend:
          kind: tensorrt
          templates:
          - {kind: float, model_id: chess-lc0-attention-8x160, engine_path: /workspace/tensorrt/lc0-attention-8x160-fp16-b64.engine}
          - {kind: float, model_id: chess-lc0-attention-10x192, engine_path: /workspace/tensorrt/lc0-attention-10x192-fp16-b64.engine}
          bootstrap_with_torchscript: true
          allow_fidelity_deviation: true
  - opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 1
    final_generation: null
    kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.3
    advance_score_threshold: 0.7
    bracket_rungs: 3
    engine_executable_path: engines/stockfish-13
    search:
      searches_per_move: 1
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        sdpa_backend: memory_efficient
        backend:
          kind: tensorrt
          templates:
          - {kind: float, model_id: chess-lc0-attention-8x160, engine_path: /workspace/tensorrt/lc0-attention-8x160-fp16-b64.engine}
          - {kind: float, model_id: chess-lc0-attention-10x192, engine_path: /workspace/tensorrt/lc0-attention-10x192-fp16-b64.engine}
          bootstrap_with_torchscript: true
          allow_fidelity_deviation: true
  - opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 1
    final_generation: null
    kind: progressive_candidate
    definition_id: progressive-candidate
    search: *searched_ladder_search
