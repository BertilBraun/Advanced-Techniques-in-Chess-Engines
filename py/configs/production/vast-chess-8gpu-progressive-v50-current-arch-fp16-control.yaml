extends: vast-chess-8gpu-progressive-v49-inference-only-bootstrap.yaml

run:
  run_name: vast-chess-8gpu-progressive-v50-current-arch-fp16-control-retry3
  tensorboard_run_directory: vast-chess-8gpu-progressive-v50-current-arch-fp16-control-retry3
  resume:
    mode: random_initialization

training:
  save_path: py/training_data/production/vast-chess-8gpu-progressive-v50-current-arch-fp16-control-retry3
  trainer:
    quantization:
      kind: disabled
  limits:
    maximum_cost: null
    maximum_wall_time_seconds: 6600
    minimum_free_disk_gib: 5.0
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-progressive-v50-current-arch-fp16-control-retry3.stop

chess:
  self_play:
    inference:
      backend:
        kind: tensorrt
        bootstrap_with_torchscript: false
        templates:
        - {kind: float, model_id: chess-cnn-scaled-post-12x128-fromto-int8, engine_path: /workspace/tensorrt/v50-current-arch-12x128-plain-fp16-b320.engine}
        - {kind: float, model_id: chess-cnn-scaled-post-14x160-fromto-int8, engine_path: /workspace/tensorrt/v48-14x160-prefold-fp16-b320.engine}
        - {kind: float, model_id: chess-cnn-scaled-post-19x176-fromto-int8, engine_path: /workspace/tensorrt/v48-19x176-prefold-fp16-b320.engine}

evaluation:
  definitions:
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search: &v50_evaluation_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          bootstrap_with_torchscript: false
          templates:
          - {kind: float, model_id: chess-cnn-scaled-post-12x128-fromto-int8, engine_path: /workspace/tensorrt/v50-current-arch-12x128-plain-fp16-b64.engine}
          - {kind: float, model_id: chess-cnn-scaled-post-14x160-fromto-int8, engine_path: /workspace/tensorrt/v48-14x160-prefold-fp16-b64.engine}
          - {kind: float, model_id: chess-cnn-scaled-post-19x176-fromto-int8, engine_path: /workspace/tensorrt/v48-19x176-prefold-fp16-b64.engine}
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search:
      <<: *v50_evaluation_search
      searches_per_move: 1
