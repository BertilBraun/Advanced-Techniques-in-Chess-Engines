extends: vast-chess-8gpu-integrated-v34.yaml

run:
  run_name: vast-chess-8gpu-v51-v34-arch-trt-fp16-adamw008
  tensorboard_run_directory: vast-chess-8gpu-v51-v34-arch-trt-fp16-adamw008
  resume:
    mode: weights_only
    model_path: /workspace/chess-run-source/v34-fp16-reproduction/py/training_data/production/vast-chess-8gpu-v34-fp16-reproduction-control/model_0.pt

training:
  save_path: py/training_data/production/vast-chess-8gpu-v51-v34-arch-trt-fp16-adamw008
  trainer:
    learning_rate:
      kind: staged
      stages:
      - {start_generation: 0, value: 0.008}
      - {start_generation: 100, value: 0.004}
      - {start_generation: 800, value: 0.003}
      - {start_generation: 1200, value: 0.002}
  limits:
    maximum_cost: null
    maximum_wall_time_seconds: 3000
    minimum_free_disk_gib: 5.0
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v51-v34-arch-trt-fp16-adamw008.stop

chess:
  self_play:
    inference:
      backend:
        kind: tensorrt
        bootstrap_with_torchscript: false
        templates:
        - kind: float
          model_id: chess-cnn-12x128-fromto
          engine_path: /workspace/tensorrt/v51-v34-arch-fp16-b320.engine
        - kind: float
          model_id: chess-cnn-14x160-fromto
          engine_path: /workspace/tensorrt/v35-medium-fp16-template.engine

evaluation:
  cadence_seconds: 480
