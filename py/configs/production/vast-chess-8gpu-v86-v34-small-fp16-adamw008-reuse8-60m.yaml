extends: vast-chess-8gpu-v83-v34-small-fp16-adamw008-reuse625-90m.yaml

run:
  run_name: vast-chess-8gpu-v86-v34-small-fp16-adamw008-reuse8-60m
  tensorboard_run_directory: vast-chess-8gpu-v86-v34-small-fp16-adamw008-reuse8-60m
  resume:
    mode: random_initialization

training:
  save_path: py/training_data/production/vast-chess-8gpu-v86-v34-small-fp16-adamw008-reuse8-60m
  lifecycle:
    credit:
      replay_ratio: 8
  limits:
    maximum_wall_time_seconds: 4000
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v86-v34-small-fp16-adamw008-reuse8-60m.stop

chess:
  self_play:
    inference:
      backend:
        kind: tensorrt
        bootstrap_with_torchscript: true
        # A marginal FP16 outlier on one probe position killed V84 at generation 21. Warn instead.
        allow_fidelity_deviation: true
        templates:
        - {kind: float, model_id: chess-cnn-12x128-fromto, engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b320.engine}
        - {kind: float, model_id: chess-cnn-14x160-fromto, engine_path: /workspace/tensorrt/v35-medium-fp16-template.engine}

evaluation:
  cadence_seconds: 600
  maximum_concurrent_jobs: 16
  definitions:
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    bracket_rungs: 3
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search: &v86_evaluation_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          bootstrap_with_torchscript: false
          allow_fidelity_deviation: true
          templates:
          - {kind: float, model_id: chess-cnn-12x128-fromto, engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b64.engine}
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    bracket_rungs: 3
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search:
      <<: *v86_evaluation_search
      searches_per_move: 1
