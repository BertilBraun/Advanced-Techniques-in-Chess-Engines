extends: vast-chess-8gpu-integrated-v34.yaml

run:
  run_name: vast-chess-8gpu-v34-fp16-reproduction-control
  tensorboard_run_directory: vast-chess-8gpu-v34-fp16-reproduction-control
  resume:
    mode: random_initialization

training:
  save_path: py/training_data/production/vast-chess-8gpu-v34-fp16-reproduction-control
  limits:
    maximum_cost: null
    maximum_wall_time_seconds: 6600
    minimum_free_disk_gib: 5.0
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v34-fp16-reproduction-control.stop

evaluation:
  cadence_seconds: 480
