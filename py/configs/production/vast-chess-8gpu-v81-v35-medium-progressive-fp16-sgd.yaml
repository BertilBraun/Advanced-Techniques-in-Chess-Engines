extends: vast-chess-8gpu-v80-v35-medium-progressive-fp16-adamw008.yaml

run:
  run_name: vast-chess-8gpu-v81-v35-medium-progressive-fp16-sgd
  tensorboard_run_directory: vast-chess-8gpu-v81-v35-medium-progressive-fp16-sgd
  resume:
    mode: random_initialization

training:
  save_path: py/training_data/production/vast-chess-8gpu-v81-v35-medium-progressive-fp16-sgd
  trainer:
    optimizer:
      kind: sgd
      momentum: 0.9
      weight_decay: 0.0001
      nesterov: true
    learning_rate:
      kind: linear
      start_generation: 0
      end_generation: 1000
      start_value: 0.1
      end_value: 0.01
      rounding: none
    max_grad_norm: 1.0
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v81-v35-medium-progressive-fp16-sgd.stop
  progressive_model_sizing:
    promotion:
      candidate_match_gate:
        definition_id: progressive-candidate
        minimum_score: 0.48
        consecutive_evaluations: 2
      candidate_catchup_learning_rate: 0.1
