extends: vast-chess-8gpu-v70-small-progressive-trt-fp16-adamw008-1h.yaml

run:
  run_name: vast-chess-8gpu-v83-v34-small-fp16-adamw008-reuse625-90m-r4
  tensorboard_run_directory: vast-chess-8gpu-v83-v34-small-fp16-adamw008-reuse625-90m-r4
  resume:
    mode: random_initialization

training:
  save_path: py/training_data/production/vast-chess-8gpu-v83-v34-small-fp16-adamw008-reuse625-90m-r4
  trainer:
    bootstrap_initialization:
      maximum_initial_top1_mass: 0.9999999999999999
      minimum_policy_scale: 0.000001
  lifecycle:
    credit:
      replay_ratio: 6.25
  progressive_model_sizing:
    kind: fixed
    model:
      model_id: chess-cnn-12x128-fromto
      network:
        kind: convolutional
        num_layers: 12
        hidden_size: 128
        residual_context: {kind: global_pooling, placement: every_second_block}
        policy_head: {kind: chess_from_to_attention_v1, key_size: 128}
        num_value_channels: 2
        value_fc_size: 48
  limits:
    maximum_wall_time_seconds: 5400
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v83-v34-small-fp16-adamw008-reuse625-90m-r4.stop

evaluation:
  cadence_seconds: 600
  maximum_concurrent_jobs: 16
  definitions:
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    bracket_rungs: 3
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search: &v83_evaluation_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          bootstrap_with_torchscript: false
          templates:
          - kind: float
            model_id: chess-cnn-12x128-fromto
            engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b64.engine
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    bracket_rungs: 3
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search:
      <<: *v83_evaluation_search
      searches_per_move: 1
