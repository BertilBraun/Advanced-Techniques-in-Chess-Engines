extends: vast-chess-8gpu-progressive-v44-fold3000-lr008-int8.yaml

run:
  run_name: vast-chess-8gpu-progressive-v45-uniform-reuse8-int8
  tensorboard_run_directory: vast-chess-8gpu-progressive-v45-uniform-reuse8-int8

training:
  save_path: py/training_data/production/vast-chess-8gpu-progressive-v45-uniform-reuse8-int8
  trainer:
    bootstrap_policy_prior_target_top3_mass: 0.70
    quantization:
      deployment_learning_rate:
        kind: linear
        start_generation: 2
        end_generation: 1000
        start_value: 0.04
        end_value: 0.01
        rounding: none
  lifecycle:
    replay:
      capacity:
        kind: staged
        stages:
        - {start_generation: 0, value: 300000}
        - {start_generation: 5, value: 600000}
        - {start_generation: 10, value: 1000000}
        - {start_generation: 20, value: 1400000}
        - {start_generation: 40, value: 2000000}
        - {start_generation: 70, value: 3000000}
        - {start_generation: 100, value: 4000000}
        - {start_generation: 400, value: 6000000}
        - {start_generation: 700, value: 8000000}
        - {start_generation: 1000, value: 10000000}
      maximum_capacity: 10000000
    credit:
      replay_ratio: 8
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-progressive-v45-uniform-reuse8-int8.stop
