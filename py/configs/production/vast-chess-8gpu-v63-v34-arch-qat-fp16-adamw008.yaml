extends: vast-chess-8gpu-v56-v34-arch-adamw-int8-qat.yaml

run:
  run_name: vast-chess-8gpu-v63-v34-arch-qat-fp16-adamw008
  tensorboard_run_directory: vast-chess-8gpu-v63-v34-arch-qat-fp16-adamw008
  resume:
    mode: random_initialization

training:
  save_path: py/training_data/production/vast-chess-8gpu-v63-v34-arch-qat-fp16-adamw008
  trainer:
    learning_rate:
      kind: staged
      stages:
      - {start_generation: 0, value: 0.008}
      - {start_generation: 100, value: 0.006}
      - {start_generation: 400, value: 0.004}
      - {start_generation: 800, value: 0.003}
      - {start_generation: 1200, value: 0.002}
    quantization:
      int8_self_play_start_generation: 1000000
  limits:
    maximum_wall_time_seconds: 3000
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v63-v34-arch-qat-fp16-adamw008.stop

