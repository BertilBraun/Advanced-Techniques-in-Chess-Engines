extends: vast-chess-8gpu-integrated-v35-int8-from-scratch.yaml

run:
  run_name: vast-chess-8gpu-v68-v35-inplace-int8-adamw008
  tensorboard_run_directory: vast-chess-8gpu-v68-v35-inplace-int8-adamw008
  resume:
    mode: random_initialization

training:
  save_path: py/training_data/production/vast-chess-8gpu-v68-v35-inplace-int8-adamw008
  trainer:
    optimizer:
      kind: adamw
    learning_rate:
      kind: staged
      stages:
      - {start_generation: 0, value: 0.008}
      - {start_generation: 100, value: 0.006}
      - {start_generation: 400, value: 0.004}
      - {start_generation: 800, value: 0.003}
      - {start_generation: 1200, value: 0.002}
    warmup_optimizer_steps: 1000
    warmup_start_learning_rate: 0.0
    bootstrap_probe_positions: 516
    bootstrap_policy_prior_target_top3_mass: 0.95
    bootstrap_initialization:
      candidate_count: 20
      maximum_initial_top1_mass: 0.8
      minimum_wdl_entropy_ratio: 0.8
      maximum_absolute_expected_value: 0.25
      minimum_policy_scale: 0.01
      maximum_policy_scale: 100.0
    max_grad_norm: 0.5
    quantization:
      kind: tensorrt_int8_qat
      fold_after_optimizer_steps: 1000
      folding_mode: in_place
      calibration_positions: 516
      recalibration_interval_generations: 1
      int8_self_play_start_generation: 1
      deployment_learning_rate: inherit
      deployment_warmup_optimizer_steps: 500
      deployment_warmup_start_learning_rate: 0.001
  lifecycle:
    credit:
      replay_ratio: 8
  limits:
    maximum_wall_time_seconds: 1800
    minimum_free_disk_gib: 5.0
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v68-v35-inplace-int8-adamw008.stop

evaluation:
  cadence_seconds: 240

