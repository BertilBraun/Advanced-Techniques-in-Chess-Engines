chess:
  self_play:
    resignation:
      kind: calibrated
      first_production_generation: 70
      false_nonloss_rate_ceiling: 0.025
      continuation_game_probability: 0.2
      triggered_game_window: 2000
      candidate_threshold_minimum: -0.99
      candidate_threshold_maximum: -0.7
      candidate_threshold_step: 0.01
      minimum_evidence_trigger_count: 100
      confidence_level: 0.95
      maximum_relaxation_per_generation: 0.01
    search:
      baseline_visits:
        kind: staged
        stages:
        - start_generation: 0
          value: 300
        - start_generation: 10
          value: 400
        - start_generation: 50
          value: 500
        - start_generation: 90
          value: 600
        - start_generation: 1000
          value: 800
      dirichlet_epsilon: 0.25
      dirichlet_alpha: 0.3
      exploration_constant: 1.5
      first_play_urgency:
        kind: reduced_parent_value
        reduction: 0.2
      forced_playouts:
        kind: enabled
        coefficient: 1.5
    inference:
      inference_workers: 1
      inference_batch_size: 320
      outstanding_batches_per_worker: 2
      sdpa_backend: memory_efficient
      precision: bfloat16
      memory_format: channels_last
      cudnn_benchmark: true
    start_position:
      kind: restart_state
      standard_start_probability: 0.1
      random_start_probability: 0.4
      restart_start_probability: 0.5
      random_opening_plies: 5
      uniform_restart_probability: 0.3
      candidate_visit_mass: 0.85
      minimum_candidates: 2
      maximum_candidates: 3
      maximum_absolute_root_value: 0.8
      minimum_remaining_plies: 15
      maximum_archive_positions: 50000
      maximum_age_generations: 40
    retained_root_visit_fraction: 0.6
    greedy_after_ply:
      kind: staged
      stages:
      - start_generation: 0
        value: 60
      - start_generation: 110
        value: 80
    maximum_game_plies: null
    starting_temperature: 1.3
    final_temperature: 0.1
    primary_sample_weight: 1.0
    detailed_statistics_workers: 1
    early_termination:
      maximum_game_plies:
        kind: staged
        stages:
        - start_generation: 0
          value: 150
        - start_generation: 50
          value: 160
        - start_generation: 80
          value: 180
        - start_generation: 110
          value: 200
        - start_generation: 140
          value: 250
      censor_remaining_game_length_target: true
      value_target: search_root_value
  objective:
    policy_loss_weight: 1.5
    value_loss_weight: 1.0
    root_value_blend:
      kind: linear
      start_generation: 50
      end_generation: 110
      start_value: 0.0
      end_value: 0.1
      rounding: none
    value_discount_per_ply: 0.998
    auxiliary_targets:
    - kind: next_policy
      ply_offset: 1
      loss_weight: 0.15
    - kind: remaining_game_length
      loss_weight: 0.1
      normalization_scale: 400.0
    search_value_discount_per_ply: 0.99
