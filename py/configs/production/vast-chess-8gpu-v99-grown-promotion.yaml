extends: vast-chess-8gpu-v98-catchup-floor.yaml

# The 19x176 is promoted as the active model, grown function-preserving from the 14x160 and given
# one epoch over the replay window. It is the last configured stage, so there is no successor and
# no candidate: the match gate stays quiet by construction, and the ladder is the only signal.
run:
  run_name: vast-chess-8gpu-v99-grown-promotion
  tensorboard_run_directory: vast-chess-8gpu-v99-grown-promotion
  resume:
    mode: checkpoint
    checkpoint_manifest_path: py/training_data/production/vast-chess-8gpu-v89-v35-progressive-int8-sgd-reuse4-plateau/checkpoint_1020.json
    generation: 1020

training:
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v99-grown-promotion.stop
