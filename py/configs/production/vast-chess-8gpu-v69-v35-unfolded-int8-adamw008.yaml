extends: vast-chess-8gpu-v68-v35-inplace-int8-adamw008.yaml

run:
  run_name: vast-chess-8gpu-v69-v35-unfolded-int8-adamw008
  tensorboard_run_directory: vast-chess-8gpu-v69-v35-unfolded-int8-adamw008
  resume:
    mode: random_initialization

training:
  save_path: py/training_data/production/vast-chess-8gpu-v69-v35-unfolded-int8-adamw008
  trainer:
    quantization:
      fold_after_optimizer_steps: 1000000
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v69-v35-unfolded-int8-adamw008.stop

evaluation:
  cadence_seconds: 240
  definitions:
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 2
    final_generation: null
    search: &unfolded_int8_evaluation_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          bootstrap_with_torchscript: true
          templates:
          - kind: qat
            model_id: chess-cnn-scaled-post-14x160-fromto-int8
            phase: pre_fold
            engine_path: /workspace/tensorrt/v35-int8-14x160-prefold-eval-template.engine
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 2
    final_generation: null
    search:
      <<: *unfolded_int8_evaluation_search
      searches_per_move: 1
