extends: vast-chess-8gpu-v60-v34-arch-trt-fp16-transition-fixed.yaml

run:
  run_name: vast-chess-8gpu-v70-small-progressive-trt-fp16-adamw008-1h
  tensorboard_run_directory: vast-chess-8gpu-v70-small-progressive-trt-fp16-adamw008-1h
  resume:
    mode: weights_only
    model_path: /workspace/chess-run-source/v34-fp16-reproduction/py/training_data/production/vast-chess-8gpu-v34-fp16-reproduction-control/model_0.pt

training:
  save_path: py/training_data/production/vast-chess-8gpu-v70-small-progressive-trt-fp16-adamw008-1h
  trainer:
    bootstrap_probe_positions: 516
    bootstrap_policy_prior_target_top3_mass: 0.95
    bootstrap_initialization:
      candidate_count: 20
      maximum_initial_top1_mass: 0.8
      minimum_wdl_entropy_ratio: 0.8
      maximum_absolute_expected_value: 0.25
      minimum_policy_scale: 0.01
      maximum_policy_scale: 100.0
    learning_rate:
      kind: staged
      stages:
      - {start_generation: 0, value: 0.008}
      - {start_generation: 100, value: 0.006}
      - {start_generation: 400, value: 0.004}
      - {start_generation: 800, value: 0.003}
      - {start_generation: 1200, value: 0.002}
  progressive_model_sizing:
    candidate_start:
      kind: elapsed
      start_days: [0.04]
  limits:
    maximum_wall_time_seconds: 3600
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v70-small-progressive-trt-fp16-adamw008-1h.stop

evaluation:
  cadence_seconds: 480
