extends: vast-chess-8gpu-v63-v34-arch-qat-fp16-adamw008-r5.yaml

run:
  run_name: vast-chess-8gpu-v74-v34-small-prefold-int8-adamw008-40m
  tensorboard_run_directory: vast-chess-8gpu-v74-v34-small-prefold-int8-adamw008-40m

training:
  save_path: py/training_data/production/vast-chess-8gpu-v74-v34-small-prefold-int8-adamw008-40m
  trainer:
    quantization:
      kind: tensorrt_int8_qat
      fold_after_optimizer_steps: 1000000
      folding_mode: deployment_copy
      calibration_positions: 516
      recalibration_interval_generations: 1
      int8_self_play_start_generation: 1
      deployment_learning_rate: inherit
      deployment_warmup_optimizer_steps: 500
      deployment_warmup_start_learning_rate: 0.001
  progressive_model_sizing:
    kind: fixed
    model:
      model_id: chess-cnn-12x128-fromto
      network:
        kind: convolutional
        num_layers: 12
        hidden_size: 128
        residual_block:
          kind: post_activation
        residual_context:
          kind: global_pooling
          placement: every_second_block
        policy_head:
          kind: chess_from_to_attention_v1
          key_size: 128
        num_value_channels: 2
        value_fc_size: 48
  limits:
    maximum_wall_time_seconds: 2400
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v74-v34-small-prefold-int8-adamw008-40m.stop

chess:
  self_play:
    inference:
      backend:
        kind: tensorrt
        bootstrap_with_torchscript: true
        templates:
        - kind: qat
          model_id: chess-cnn-12x128-fromto
          phase: pre_fold
          engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b320.engine

evaluation:
  cadence_seconds: 480
  definitions:
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search: &v74_evaluation_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          bootstrap_with_torchscript: true
          templates:
          - kind: qat
            model_id: chess-cnn-12x128-fromto
            phase: pre_fold
            engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b64.engine
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search:
      <<: *v74_evaluation_search
      searches_per_move: 1
