extends: vast-chess-8gpu-v54-v34-arch-trt-fp16-fixed.yaml

run:
  run_name: vast-chess-8gpu-v56-v34-arch-adamw-int8-qat
  tensorboard_run_directory: vast-chess-8gpu-v56-v34-arch-adamw-int8-qat

training:
  save_path: py/training_data/production/vast-chess-8gpu-v56-v34-arch-adamw-int8-qat
  trainer:
    quantization:
      kind: tensorrt_int8_qat
      fold_after_optimizer_steps: 3000
      calibration_positions: 2048
      recalibration_interval_generations: 1
      int8_self_play_start_generation: 10
      deployment_learning_rate: inherit
      deployment_warmup_optimizer_steps: 500
      deployment_warmup_start_learning_rate: 0.001
  limits:
    maximum_wall_time_seconds: 3000
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v56-v34-arch-adamw-int8-qat.stop

chess:
  self_play:
    inference:
      backend:
        kind: tensorrt
        bootstrap_with_torchscript: true
        templates:
        - {kind: qat_float, model_id: chess-cnn-12x128-fromto, phase: pre_fold, engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b320.engine}
        - {kind: qat_float, model_id: chess-cnn-12x128-fromto, phase: deployment, engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b320.engine}
        - {kind: qat, model_id: chess-cnn-12x128-fromto, phase: deployment, engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b320.engine}
        - {kind: qat_float, model_id: chess-cnn-14x160-fromto, phase: pre_fold, engine_path: /workspace/tensorrt/v35-medium-fp16-template.engine}
        - {kind: qat_float, model_id: chess-cnn-14x160-fromto, phase: deployment, engine_path: /workspace/tensorrt/v35-medium-fp16-template.engine}
        - {kind: qat, model_id: chess-cnn-14x160-fromto, phase: deployment, engine_path: /workspace/tensorrt/v35-medium-fp16-template.engine}

evaluation:
  definitions:
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search: &v56_evaluation_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          bootstrap_with_torchscript: true
          templates:
          - {kind: qat_float, model_id: chess-cnn-12x128-fromto, phase: pre_fold, engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b64.engine}
          - {kind: qat_float, model_id: chess-cnn-12x128-fromto, phase: deployment, engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b64.engine}
          - {kind: qat, model_id: chess-cnn-12x128-fromto, phase: deployment, engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b64.engine}
          - {kind: qat_float, model_id: chess-cnn-14x160-fromto, phase: pre_fold, engine_path: /workspace/tensorrt/v35-medium-fp16-template.engine}
          - {kind: qat_float, model_id: chess-cnn-14x160-fromto, phase: deployment, engine_path: /workspace/tensorrt/v35-medium-fp16-template.engine}
          - {kind: qat, model_id: chess-cnn-14x160-fromto, phase: deployment, engine_path: /workspace/tensorrt/v35-medium-fp16-template.engine}
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search:
      <<: *v56_evaluation_search
      searches_per_move: 1
