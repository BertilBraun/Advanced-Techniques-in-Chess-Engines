extends: vast-chess-8gpu-progressive-v40-int8.yaml

run:
  run_name: vast-chess-8gpu-progressive-v43-katago-init-int8
  tensorboard_run_directory: vast-chess-8gpu-progressive-v43-katago-init-int8

training:
  save_path: py/training_data/production/vast-chess-8gpu-progressive-v43-katago-init-int8
  trainer:
    learning_rate:
      kind: linear
      start_generation: 0
      end_generation: 1200
      start_value: 0.04
      end_value: 0.01
      rounding: none
    warmup_optimizer_steps: 3000
    warmup_start_learning_rate: 0.001
    quantization:
      kind: tensorrt_int8_qat
      fold_after_optimizer_steps: 3000
      calibration_positions: 256
      recalibration_interval_generations: 1
      deployment_learning_rate: inherit
      deployment_warmup_optimizer_steps: 0
      deployment_warmup_start_learning_rate: 0.001
  lifecycle:
    replay:
      capacity:
        kind: staged
        stages:
        - {start_generation: 0, value: 450000}
        - {start_generation: 5, value: 900000}
        - {start_generation: 10, value: 1500000}
        - {start_generation: 20, value: 2100000}
        - {start_generation: 40, value: 3000000}
        - {start_generation: 70, value: 4500000}
        - {start_generation: 100, value: 6000000}
        - {start_generation: 400, value: 9000000}
        - {start_generation: 700, value: 12000000}
        - {start_generation: 1000, value: 15000000}
      maximum_capacity: 15000000
    credit:
      replay_ratio: 8
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-progressive-v43-katago-init-int8.stop
  progressive_model_sizing:
    promotion:
      candidate_match_gate:
        definition_id: progressive-candidate
        minimum_score: 0.48
        consecutive_evaluations: 2
      candidate_catchup_learning_rate: 0.04

chess:
  self_play:
    inference:
      backend:
        kind: tensorrt
        bootstrap_with_torchscript: true
        templates:
        - kind: qat
          model_id: chess-cnn-scaled-post-12x128-fromto-int8
          phase: pre_fold
          engine_path: /workspace/tensorrt/v43-int8-12x128-prefold-production-template.engine
        - kind: qat
          model_id: chess-cnn-scaled-post-12x128-fromto-int8
          phase: deployment
          engine_path: /workspace/tensorrt/v36-int8-12x128-deployment-trained-template.engine
        - kind: qat
          model_id: chess-cnn-scaled-post-14x160-fromto-int8
          phase: pre_fold
          engine_path: /workspace/tensorrt/v36-int8-14x160-prefold-production-template.engine
        - kind: qat
          model_id: chess-cnn-scaled-post-14x160-fromto-int8
          phase: deployment
          engine_path: /workspace/tensorrt/v36-int8-14x160-deployment-trained-template.engine
