extends: vast-chess-8gpu-v70-small-progressive-trt-fp16-adamw008-1h.yaml

run:
  run_name: vast-chess-8gpu-v72-progressive-trt-fp16-adamw008-overnight
  tensorboard_run_directory: vast-chess-8gpu-v72-progressive-trt-fp16-adamw008-overnight
  resume:
    mode: checkpoint
    checkpoint_manifest_path: py/training_data/production/vast-chess-8gpu-v70-small-progressive-trt-fp16-adamw008-1h/checkpoint_44.json
    generation: 44

training:
  save_path: py/training_data/production/vast-chess-8gpu-v70-small-progressive-trt-fp16-adamw008-1h
  progressive_model_sizing:
    kind: progressive
    models:
    - model_id: chess-cnn-12x128-fromto
      network:
        kind: convolutional
        num_layers: 12
        hidden_size: 128
        residual_block: {kind: post_activation}
        residual_context: {kind: global_pooling, placement: every_second_block}
        policy_head: {kind: chess_from_to_attention_v1, key_size: 128}
        num_value_channels: 2
        value_fc_size: 48
    - model_id: chess-cnn-14x160-fromto
      network:
        kind: convolutional
        num_layers: 14
        hidden_size: 160
        residual_block: {kind: scaled_post_activation, branch_scale: 0.2672612419124244, activation_cap: 6.0}
        residual_context: {kind: global_pooling, placement: every_second_block}
        policy_head: {kind: chess_from_to_attention_v1, key_size: 128}
        num_value_channels: 2
        value_fc_size: 48
    candidate_start:
      kind: elapsed
      start_days: [0.04]
    promotion:
      candidate_match_gate:
        definition_id: progressive-candidate
        minimum_score: 0.48
        consecutive_evaluations: 2
      candidate_catchup_learning_rate: 0.004
  limits:
    maximum_wall_time_seconds: null
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v72-progressive-trt-fp16-adamw008-overnight.stop

chess:
  self_play:
    inference:
      backend:
        kind: tensorrt
        bootstrap_with_torchscript: true
        templates:
        - kind: float
          model_id: chess-cnn-12x128-fromto
          engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b320.engine
        - kind: float
          model_id: chess-cnn-14x160-fromto
          engine_path: /workspace/tensorrt/v48-14x160-fp16-b320.engine

evaluation:
  cadence_seconds: 1200
  definitions:
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search: &v72_evaluation_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          bootstrap_with_torchscript: true
          templates:
          - kind: float
            model_id: chess-cnn-12x128-fromto
            engine_path: /workspace/tensorrt/v51-v34-arch-exact-fp16-b64.engine
          - kind: float
            model_id: chess-cnn-14x160-fromto
            engine_path: /workspace/tensorrt/v48-14x160-fp16-b64.engine
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search:
      <<: *v72_evaluation_search
      searches_per_move: 1
