# The configuration the chess work settled on, written out in full.
#
# Every other production configuration reaches its values through a chain of `extends`, which makes the
# recipe that actually ran hard to read. This one inherits nothing: what is written here is what runs.
#
# It is V89 with its run identity renamed. The recipe is SGD at 0.1 with nesterov momentum, pre-fold INT8
# quantization, replay reuse 4, and the three-stage model ladder gated on an Elo plateau. Evaluation
# brackets three rungs so the ladder fit is constrained rather than extrapolated from one score, and
# fidelity deviation warns instead of ending the run, which INT8 requires.
run:
  run_name: vast-chess-8gpu-final
  tensorboard_run_directory: vast-chess-8gpu-final
  stage: clean_retrain
  requires_explicit_approval: true
  resume:
    mode: random_initialization
  hardware:
    provider_name: vast.ai
    offer_id: '48571853'
    gpu_model: NVIDIA GeForce RTX 4070 SUPER
    gpu_count: 8
    logical_cpu_count: 80
    minimum_ram_gib: 200
    minimum_disk_gib: 5
  environment:
    runtime_image: vastai/pytorch:cuda-12.8.1-auto
    python_version: '3.12'
    torch_version: 2.12.1+cu126
    cuda_version: '12.6'
    dependency_lock_path: uv.lock
    dependency_lock_sha256: a09c3c9697dbe690c874bac20ee8690a3904dd6b8bc8e6b5478c27d61ddd03aa
    minimum_open_file_soft_limit: 65536
training:
