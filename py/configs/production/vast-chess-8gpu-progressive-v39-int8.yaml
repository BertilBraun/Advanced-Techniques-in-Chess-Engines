extends: vast-chess-8gpu-progressive-v36-int8.yaml

run:
  run_name: vast-chess-8gpu-progressive-v39-int8
  tensorboard_run_directory: vast-chess-8gpu-progressive-v39-int8

training:
  save_path: py/training_data/production/vast-chess-8gpu-progressive-v39-int8
  trainer:
    warmup_optimizer_steps: 5000
    warmup_start_learning_rate: 0.001
    quantization:
      kind: tensorrt_int8_qat
      fold_after_optimizer_steps: 10000
      calibration_positions: 256
      recalibration_interval_generations: 1
      deployment_learning_rate: inherit
      deployment_warmup_optimizer_steps: 5000
      deployment_warmup_start_learning_rate: 0.001
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-progressive-v39-int8.stop

evaluation:
  cadence_seconds: 1200
