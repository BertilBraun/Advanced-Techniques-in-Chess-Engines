extends: vast-chess-8gpu-integrated-v32.yaml

run:
  run_name: vast-chess-8gpu-integrated-v33
  tensorboard_run_directory: vast-chess-8gpu-integrated-v33

training:
  save_path: py/training_data/production/vast-chess-8gpu-integrated-v33
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-integrated-v33.stop

evaluation:
  maximum_concurrent_jobs: 3
  definitions:
  - kind: fixed_dataset
    definition_id: fixed-dataset
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    node_ladder:
    - 30
    - 100
    - 300
    - 1000
    - 2000
    - 3000
    - 5000
    - 10000
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search: &searched_evaluation
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    node_ladder:
    - 30
    - 100
    - 300
    - 1000
    - 2000
    - 3000
    - 5000
    - 10000
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search:
      <<: *searched_evaluation
      searches_per_move: 1
