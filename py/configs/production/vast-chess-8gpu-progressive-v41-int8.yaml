extends: vast-chess-8gpu-progressive-v40-int8.yaml

run:
  run_name: vast-chess-8gpu-progressive-v41-int8
  tensorboard_run_directory: vast-chess-8gpu-progressive-v41-int8

training:
  save_path: py/training_data/production/vast-chess-8gpu-progressive-v41-int8
  trainer:
    quantization:
      kind: tensorrt_int8_qat
      fold_after_optimizer_steps: 1000
      calibration_positions: 256
      recalibration_interval_generations: 1
      deployment_learning_rate:
        kind: linear
        start_generation: 2
        end_generation: 1000
        start_value: 0.02
        end_value: 0.01
        rounding: none
      deployment_warmup_optimizer_steps: 0
      deployment_warmup_start_learning_rate: 0.001
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-progressive-v41-int8.stop
