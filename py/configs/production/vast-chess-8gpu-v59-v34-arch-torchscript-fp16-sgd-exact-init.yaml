extends: vast-chess-8gpu-v58-v34-arch-torchscript-fp16-exact-init.yaml

run:
  run_name: vast-chess-8gpu-v59-v34-arch-torchscript-fp16-sgd-exact-init-retry2
  tensorboard_run_directory: vast-chess-8gpu-v59-v34-arch-torchscript-fp16-sgd-exact-init-retry2
  resume:
    mode: weights_only
    model_path: /workspace/chess-run-source/v34-fp16-reproduction/py/training_data/production/vast-chess-8gpu-v34-fp16-reproduction-control/model_0.pt

training:
  save_path: py/training_data/production/vast-chess-8gpu-v59-v34-arch-torchscript-fp16-sgd-exact-init-retry2
  trainer:
    optimizer:
      kind: sgd
      momentum: 0.9
      weight_decay: 0.0001
      nesterov: true
    learning_rate:
      kind: linear
      start_generation: 0
      end_generation: 1000
      start_value: 0.01
      end_value: 0.001
      rounding: none
    max_grad_norm: 5.0
  limits:
    maximum_wall_time_seconds: 3000
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v59-v34-arch-torchscript-fp16-sgd-exact-init-retry2.stop
