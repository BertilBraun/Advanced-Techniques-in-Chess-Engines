extends: vast-chess-8gpu-progressive-v39-int8.yaml

run:
  run_name: vast-chess-8gpu-progressive-v40-int8
  tensorboard_run_directory: vast-chess-8gpu-progressive-v40-int8

training:
  save_path: py/training_data/production/vast-chess-8gpu-progressive-v40-int8
  trainer:
    warmup_optimizer_steps: 1000
    warmup_start_learning_rate: 0.001
    quantization:
      kind: tensorrt_int8_qat
      fold_after_optimizer_steps: 1000
      calibration_positions: 256
      recalibration_interval_generations: 1
      deployment_learning_rate:
        kind: linear
        start_generation: 2
        end_generation: 1200
        start_value: 0.06
        end_value: 0.01
        rounding: none
      deployment_warmup_optimizer_steps: 3000
      deployment_warmup_start_learning_rate: 0.001
  lifecycle:
    replay:
      capacity:
        kind: staged
        stages:
        - {start_generation: 0, value: 300000}
        - {start_generation: 5, value: 600000}
        - {start_generation: 10, value: 1000000}
        - {start_generation: 20, value: 1400000}
        - {start_generation: 40, value: 2000000}
        - {start_generation: 70, value: 3000000}
        - {start_generation: 100, value: 4000000}
        - {start_generation: 400, value: 6000000}
        - {start_generation: 700, value: 8000000}
        - {start_generation: 1000, value: 10000000}
      maximum_capacity: 10000000
    credit:
      replay_ratio: 8
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-progressive-v40-int8.stop

evaluation:
  cadence_seconds: 1200
  maximum_concurrent_jobs: 1
  definitions:
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search: &int8_evaluation_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          bootstrap_with_torchscript: true
          templates:
          - kind: qat
            model_id: chess-cnn-scaled-post-12x128-fromto-int8
            phase: deployment
            engine_path: /workspace/tensorrt/v36-int8-12x128-deployment-trained-eval64-template.engine
          - kind: qat
            model_id: chess-cnn-scaled-post-14x160-fromto-int8
            phase: deployment
            engine_path: /workspace/tensorrt/v36-int8-14x160-deployment-trained-eval64-template.engine
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 0
    final_generation: null
    search:
      <<: *int8_evaluation_search
      searches_per_move: 1
