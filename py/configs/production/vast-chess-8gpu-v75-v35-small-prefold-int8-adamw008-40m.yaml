extends: vast-chess-8gpu-v69-v35-unfolded-int8-adamw008.yaml

run:
  run_name: vast-chess-8gpu-v75-v35-small-prefold-int8-adamw008-40m
  tensorboard_run_directory: vast-chess-8gpu-v75-v35-small-prefold-int8-adamw008-40m

training:
  save_path: py/training_data/production/vast-chess-8gpu-v75-v35-small-prefold-int8-adamw008-40m
  trainer:
    quantization:
      fold_after_optimizer_steps: 1000000
      folding_mode: deployment_copy
  progressive_model_sizing:
    kind: fixed
    model:
      model_id: chess-cnn-scaled-post-12x128-fromto-int8
      network:
        kind: convolutional
        num_layers: 12
        hidden_size: 128
        residual_block:
          kind: scaled_post_activation
          branch_scale: 0.2886751345948129
          activation_cap: 6.0
        residual_context:
          kind: global_pooling
          placement: every_second_block
        policy_head:
          kind: chess_from_to_attention_v1
          key_size: 128
        num_value_channels: 2
        value_fc_size: 48
  limits:
    maximum_wall_time_seconds: 2400
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-v75-v35-small-prefold-int8-adamw008-40m.stop

chess:
  self_play:
    inference:
      backend:
        kind: tensorrt
        bootstrap_with_torchscript: true
        templates:
        - kind: qat
          model_id: chess-cnn-scaled-post-12x128-fromto-int8
          phase: pre_fold
          engine_path: /workspace/tensorrt/v43-int8-12x128-prefold-stable-c0c1f585.engine

evaluation:
  cadence_seconds: 480
  definitions:
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-searched
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 1
    final_generation: null
    search: &v75_evaluation_search
      searches_per_move: 64
      parallel_searches: 1
      exploration_constant: auto
      inference:
        inference_workers: 1
        inference_batch_size: 64
        outstanding_batches_per_worker: 1
        backend:
          kind: tensorrt
          bootstrap_with_torchscript: true
          templates:
          - kind: qat
            model_id: chess-cnn-scaled-post-12x128-fromto-int8
            phase: pre_fold
            engine_path: /workspace/tensorrt/v43-int8-12x128-prefold-eval64-template.engine
        sdpa_backend: memory_efficient
  - kind: stockfish_adaptive_nodes
    definition_id: stockfish-policy-only
    node_ladder: [30, 100, 300, 1000, 2000, 3000, 5000, 10000]
    initial_nodes: 30
    retreat_score_threshold: 0.30
    advance_score_threshold: 0.70
    engine_executable_path: engines/stockfish-13
    opening_pair_count: 50
    maximum_game_plies: 300
    first_generation: 1
    final_generation: null
    search:
      <<: *v75_evaluation_search
      searches_per_move: 1
