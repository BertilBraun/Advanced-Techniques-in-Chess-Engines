extends: vast-chess-8gpu-progressive-v40-int8.yaml

run:
  run_name: vast-chess-8gpu-fixed-medium-v42-int8
  tensorboard_run_directory: vast-chess-8gpu-fixed-medium-v42-int8

training:
  save_path: py/training_data/production/vast-chess-8gpu-fixed-medium-v42-int8
  trainer:
    warmup_optimizer_steps: 1000
    warmup_start_learning_rate: 0.001
    quantization:
      kind: tensorrt_int8_qat
      fold_after_optimizer_steps: 1000
      calibration_positions: 256
      recalibration_interval_generations: 1
      deployment_learning_rate:
        kind: linear
        start_generation: 2
        end_generation: 1000
        start_value: 0.02
        end_value: 0.01
        rounding: none
      deployment_warmup_optimizer_steps: 0
      deployment_warmup_start_learning_rate: 0.001
  lifecycle:
    replay:
      capacity:
        kind: staged
        stages:
        - {start_generation: 0, value: 450000}
        - {start_generation: 5, value: 900000}
        - {start_generation: 10, value: 1500000}
        - {start_generation: 20, value: 2100000}
        - {start_generation: 40, value: 3000000}
        - {start_generation: 70, value: 4500000}
        - {start_generation: 100, value: 6000000}
        - {start_generation: 400, value: 9000000}
        - {start_generation: 700, value: 12000000}
        - {start_generation: 1000, value: 15000000}
      maximum_capacity: 15000000
    credit:
      replay_ratio: 6.25
  limits:
    manual_stop_file: /workspace/run-control/stop/vast-chess-8gpu-fixed-medium-v42-int8.stop
  progressive_model_sizing:
    kind: fixed
    model:
      model_id: chess-cnn-scaled-post-14x160-fromto-int8
      network:
        kind: convolutional
        num_layers: 14
        hidden_size: 160
        residual_block:
          kind: scaled_post_activation
          branch_scale: 0.2672612419124244
          activation_cap: 6.0
        residual_context:
          kind: global_pooling
          placement: every_second_block
        policy_head:
          kind: chess_from_to_attention_v1
          key_size: 128
        num_value_channels: 2
        value_fc_size: 48
