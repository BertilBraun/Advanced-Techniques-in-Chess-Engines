extends: ../baselines/vast-go-9x9-2gpu-4h.yaml
run:
  run_name: go9-progressive-model-sizing
  tensorboard_run_directory: go9-progressive-model-sizing
training:
  save_path: py/training_data/research/go9-progressive-model-sizing
  limits:
    maximum_wall_time_seconds: 172800
  progressive_model_sizing:
    models:
      - model_id: small
        training_start_days: 0.0
        network:
          num_layers: 8
          hidden_size: 96
          residual_context:
            kind: global_pooling
            placement: every_second_block
          policy_head: {kind: go_point_pass_v1}
          num_value_channels: 1
          value_fc_size: 32
      - model_id: medium
        training_start_days: 0.75
        network:
          num_layers: 10
          hidden_size: 128
          residual_context:
            kind: global_pooling
            placement: every_second_block
          policy_head: {kind: go_point_pass_v1}
          num_value_channels: 1
          value_fc_size: 32
      - model_id: large
        training_start_days: 1.5
        network:
          num_layers: 15
          hidden_size: 192
          residual_context:
            kind: global_pooling
            placement: every_second_block
          policy_head: {kind: go_point_pass_v1}
          num_value_channels: 1
          value_fc_size: 32
    promotion:
      decay: 0.8
      warmup_quanta: 10
      maximum_relative_loss: 1.01
