extends: ../baselines/vast-go-9x9-2gpu-4h.yaml
run:
  run_name: go9-progressive-model-sizing
  tensorboard_run_directory: go9-progressive-model-sizing
training:
  save_path: py/training_data/research/go9-progressive-model-sizing
  limits:
    maximum_wall_time_seconds: 172800
  progressive_model_sizing:
    kind: progressive
    models:
      - model_id: small
        network:
          num_layers: 8
          hidden_size: 96
          residual_context:
            kind: global_pooling
            placement: every_second_block
          policy_head: {kind: go_point_pass_v1}
          num_value_channels: 1
          value_fc_size: 32
      - model_id: medium
        network:
          num_layers: 10
          hidden_size: 128
          residual_context:
            kind: global_pooling
            placement: every_second_block
          policy_head: {kind: go_point_pass_v1}
          num_value_channels: 1
          value_fc_size: 32
      - model_id: large
        network:
          num_layers: 15
          hidden_size: 192
          residual_context:
            kind: global_pooling
            placement: every_second_block
          policy_head: {kind: go_point_pass_v1}
          num_value_channels: 1
          value_fc_size: 32
    candidate_start:
      kind: elapsed
      start_days: [0.75, 1.5]
    promotion:
      candidate_match_gate:
        definition_id: progressive-candidate
        minimum_score: 0.48
        consecutive_evaluations: 2
      candidate_catchup_learning_rate: 0.01
