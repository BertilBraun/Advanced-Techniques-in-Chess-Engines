game: go
run:
  run_name: go-9x9-template
  tensorboard_run_directory: go-9x9-template
  stage: clean_retrain
  requires_explicit_approval: true
  resume:
    mode: random_initialization
  hardware:
    provider_name: local
    offer_id: local
    gpu_model: unconfirmed
    gpu_count: 1
    logical_cpu_count: 8
    minimum_ram_gib: 8
    minimum_disk_gib: 1
  environment:
    runtime_image: local
    python_version: '3.12'
    torch_version: 2.12.1+cu126
    cuda_version: '12.6'
    dependency_lock_path: uv.lock
    dependency_lock_sha256: 11074667d5b9e5075faee3d75817f2fbe1af8b863299ed27acd14809f939c484
    minimum_open_file_soft_limit: 1024
training:
  save_path: py/training_data/go-9x9
  progressive_model_sizing:
    models:
      - model_id: go-9x9-test-model
        training_start_days: 0.0
        network:
          num_layers: 8
          hidden_size: 96
          residual_context:
            kind: squeeze_excitation
            placement: every_second_block
          policy_head: {kind: go_point_pass_v1}
          num_value_channels: 1
          value_fc_size: 32
    promotion: {decay: 0.8, warmup_quanta: 2, maximum_relative_loss: 1.01}
  trainer:
    global_batch_size: 256
    local_batch_size: 256
    optimizer: adamw
    precision: float32
    compilation: disabled
    learning_rate: 0.002
  topology:
    trainer:
      device_type: cpu
      process_group_backend: gloo
      rank_zero_device_id: 0
      ddp_device_ids: [0]
      cpu_threads: 1
      interop_threads: 1
    self_play:
      device_ids: [0]
      parallel_games_per_process: 8
      tensorboard_processes: 1
      node_ids_to_pause_during_training: []
    evaluation:
      device_cycle: [0]
  lifecycle:
    replay:
      capacity:
        kind: linear
        start_generation: 0
        end_generation: 200
        start_value: 100000
        end_value: 2500000
        rounding: nearest
      maximum_capacity: 2500000
      maximum_policy_entries: 82
    credit:
      replay_ratio: 8
      optimizer_steps_per_quantum: 100
      maximum_optimizer_steps: 100000
      retained_checkpoint_interval_generations: 1
      self_play_backpressure_quanta: 5
    inference_retention:
      recent_checkpoint_count: 11
      milestone_interval: 10
  limits:
    hourly_price: 1.0
    maximum_wall_time_seconds: 21600
    maximum_open_file_count: 32768
    maximum_host_ram_percent: 95.0
    minimum_free_disk_gib: 0.1
    resource_telemetry_interval_seconds: 5.0
  random_seed: 0
evaluation:
  cadence_seconds: 1200
  job_timeout_seconds: 1800
  shutdown_grace_seconds: 30
  bootstrap_samples: 10000
  maximum_concurrent_jobs: 10
  dataset:
    path: py/reference/go-9x9-book-evaluation-v1.bin
    source:
      kind: katago_book
      position_count: 500
      selection:
        export_path: py/reference/go-9x9-katago-book-20260226-v2.json
        export_sha256: e1f1fe4acb40e830a3f8a3762a6c5ec0b3a7586b3ce2063508f7d2eed436c1ef
        minimum_ply: 4
        maximum_ply: 12
        maximum_absolute_black_score: 7.0
        maximum_black_win_probability_deviation: 0.5
        maximum_win_probability_uncertainty: 0.3
        maximum_score_uncertainty: 6.0
        minimum_visits: 10000
  openings:
    path: py/reference/go-9x9-book-openings-v1.json
    opening_count: 200
    source:
      kind: katago_book
      selection:
        export_path: py/reference/go-9x9-katago-book-20260226-v2.json
        export_sha256: e1f1fe4acb40e830a3f8a3762a6c5ec0b3a7586b3ce2063508f7d2eed436c1ef
        minimum_ply: 4
        maximum_ply: 12
        maximum_absolute_black_score: 1.0
        maximum_black_win_probability_deviation: 0.1
        maximum_win_probability_uncertainty: 0.15
        maximum_score_uncertainty: 1.5
        minimum_visits: 10000
  engine:
    kind: katago
    executable_path: engines/katago
    model_path: engines/katago.bin.gz
    analysis_configuration_path: engines/katago-analysis.cfg
    label_max_visits: 256
  definitions:
    - kind: fixed_dataset
      definition_id: fixed-dataset
    - kind: previous_checkpoint
      definition_id: previous-20m
      boundary_offset: 1
      opening_pair_count: 100
      maximum_game_plies: 324
      search: &evaluation_search
        searches_per_move: 64
        parallel_searches: 1
        exploration_constant: 1.0
        inference:
          inference_workers: 1
          inference_batch_size: 64
          outstanding_batches_per_worker: 1
    - kind: previous_checkpoint
      definition_id: previous-40m
      boundary_offset: 2
      opening_pair_count: 100
      maximum_game_plies: 324
      search: *evaluation_search
    - kind: previous_checkpoint
      definition_id: previous-60m
      boundary_offset: 3
      opening_pair_count: 100
      maximum_game_plies: 324
      search: *evaluation_search
    - kind: katago
      definition_id: katago-64
      maximum_visits: 64
      opening_pair_count: 50
      maximum_game_plies: 324
      search: *evaluation_search
go:
  self_play:
    search:
      full_search_budget:
        kind: fixed
        visits: 256
      fast_searches: 64
      parallel_searches: 1
      dirichlet_epsilon: 0.25
      dirichlet_alpha: 0.3
      exploration_constant: 1.5
      first_play_urgency:
        kind: zero
      forced_playouts:
        kind: disabled
    inference:
      inference_workers: 1
      inference_batch_size: 64
      outstanding_batches_per_worker: 2
    start_position:
      kind: random_opening
      maximum_plies: 0
    full_search_probability: 1.0
    retained_root_visit_fraction: 0.0
    greedy_after_ply: 60
    starting_temperature: 1.0
    final_temperature: 0.1
    primary_sample_weight: 1.0
  rules:
    komi_half_points: 14
    maximum_moves: 324
  representation:
    board_size: 9
    history_length: 8
    binary_channel_count: 16
    scalar_channel_count: 1
    canonical_player_perspective: true
  objective:
    policy_loss_weight: 1.0
    value_loss_weight: 1.0
    root_value_blend: 0.0
    value_discount_per_ply: 1.0
    auxiliary_targets: []
