[program:sgd-prefold-historical-fold1000]
command=/bin/bash /workspace/sgd-fold-factorial-source/deployment/sgd_replay_screen_arm.sh historical_fold_1000 0 1 /workspace/sgd-fold-factorial/results/historical-fold1000
directory=/workspace/sgd-fold-factorial-source
autostart=false
autorestart=false
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/sgd-fold-factorial/logs/historical-fold1000.stdout.log
stderr_logfile=/workspace/sgd-fold-factorial/logs/historical-fold1000.stderr.log
environment=ENGINE_REPOSITORY_DIRECTORY="/workspace/sgd-fold-factorial-source",SGD_REPLAY_SCREEN_TIME_BUDGET_SECONDS="1800",SGD_REPLAY_SCREEN_MAXIMUM_OPTIMIZER_STEPS="10000"

