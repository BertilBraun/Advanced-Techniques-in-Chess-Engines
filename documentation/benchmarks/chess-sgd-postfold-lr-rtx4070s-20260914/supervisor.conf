[program:sgd-postfold-lr002]
command=/bin/bash /workspace/sgd-postfold-lr-source/deployment/sgd_replay_screen_arm.sh post_fold_002 0 1 /workspace/sgd-postfold-lr/results/lr002
directory=/workspace/sgd-postfold-lr-source
autostart=false
autorestart=false
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/sgd-postfold-lr/logs/lr002.stdout.log
stderr_logfile=/workspace/sgd-postfold-lr/logs/lr002.stderr.log
environment=ENGINE_REPOSITORY_DIRECTORY="/workspace/sgd-postfold-lr-source",SGD_REPLAY_SCREEN_TIME_BUDGET_SECONDS="1800",SGD_REPLAY_SCREEN_MAXIMUM_OPTIMIZER_STEPS="10000"

