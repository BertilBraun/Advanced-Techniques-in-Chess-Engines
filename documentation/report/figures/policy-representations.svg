<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 680" role="img" aria-labelledby="title description">
  <title id="title">Three chess policy representations</title>
  <desc id="description">Dense reduced-action projection, spatial move planes, and retained from-to attention share a trunk but differ in output geometry. The controlled dense and retained heads have 483,680 and 51,072 parameters respectively.</desc>
  <defs>
    <pattern id="board" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f8fafc"/>
      <rect width="10" height="10" fill="#dbe4ee"/>
      <rect x="10" y="10" width="10" height="10" fill="#dbe4ee"/>
    </pattern>
    <pattern id="matrix" width="11" height="11" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" fill="#eef6ff" stroke="#bfd8ee" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c3340; }
      .panel { fill: #f8fafb; stroke: #657d89; stroke-width: 2.4; }
      .selected { fill: #eef7f4; stroke: #17615b; stroke-width: 3; }
      .box { fill: #fff; stroke: #536d7b; stroke-width: 2.3; }
      .accent-box { fill: #dceeea; stroke: #17615b; stroke-width: 2.4; }
      .title { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .label { font-size: 18px; font-weight: 600; }
      .minor { font-size: 16px; fill: #344c58; }
      .count { font-size: 22px; font-weight: 700; }
      .accent { fill: #17615b; }
      .line { fill: none; stroke: #344f5d; stroke-width: 3; }
      .accent-line { fill: none; stroke: #17615b; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1320" height="680" fill="#fff"/>

  <rect class="panel" x="28" y="14" width="394" height="642" rx="13"/>
  <text class="title" x="55" y="62">Dense action head</text>
  <rect x="64" y="121" width="104" height="104" fill="url(#board)" stroke="#536d7b" stroke-width="2"/>
  <text class="minor" x="116" y="258" text-anchor="middle">trunk field</text>
  <path class="line" d="M178 173 H224"/>
  <path d="M224 166 L236 173 L224 180 Z" fill="#344f5d"/>
  <rect class="box" x="246" y="133" width="137" height="78" rx="8"/>
  <text class="label" x="315" y="165" text-anchor="middle">1 × 1 conv</text>
  <text class="minor" x="315" y="191" text-anchor="middle">flatten</text>
  <path class="line" d="M315 223 V295"/>
  <path d="M308 295 L315 307 L322 295 Z" fill="#344f5d"/>
  <rect class="box" x="64" y="318" width="322" height="105" rx="8"/>
  <text class="label" x="225" y="355" text-anchor="middle">Learned projection</text>
  <text class="body" x="225" y="394" text-anchor="middle">1,880 action logits</text>
  <path class="line" d="M225 434 V473"/>
  <path d="M218 473 L225 485 L232 473 Z" fill="#344f5d"/>
  <rect class="box" x="116" y="495" width="218" height="61" rx="8"/>
  <text class="label" x="225" y="533" text-anchor="middle">Legal-action mask</text>
  <line x1="55" y1="582" x2="395" y2="582" stroke="#b8c9d0" stroke-width="2"/>
  <text class="count" x="55" y="621">483,680</text>
  <text class="minor" x="180" y="620">head parameters</text>

  <rect class="panel" x="463" y="14" width="394" height="642" rx="13"/>
  <text class="title" x="490" y="62">Spatial move planes</text>
  <rect x="501" y="121" width="104" height="104" fill="url(#board)" stroke="#536d7b" stroke-width="2"/>
  <text class="minor" x="553" y="258" text-anchor="middle">trunk field</text>
  <path class="line" d="M615 173 H655"/>
  <path d="M655 166 L667 173 L655 180 Z" fill="#344f5d"/>
  <rect x="687" y="136" width="100" height="100" fill="#f7fbff" stroke="#9cbddb" stroke-width="2"/>
  <rect x="677" y="126" width="100" height="100" fill="#ecf4fd" stroke="#79a6d2" stroke-width="2"/>
  <rect x="667" y="116" width="100" height="100" fill="#dcecff" stroke="#4b89c6" stroke-width="2"/>
  <line x1="687" y1="136" x2="747" y2="196" stroke="#2878bd" stroke-width="4"/>
  <circle cx="717" cy="166" r="6" fill="#175b91"/>
  <text class="minor" x="727" y="258" text-anchor="middle">76 × 8 × 8 planes</text>
  <path class="line" d="M660 271 V301"/>
  <path d="M653 301 L660 313 L667 301 Z" fill="#344f5d"/>
  <rect class="box" x="497" y="318" width="326" height="105" rx="8"/>
  <text class="body" x="660" y="355" text-anchor="middle">Gather: 1,880 actions</text>
  <text class="body" x="660" y="394" text-anchor="middle">Direct: 4,864 cells</text>
  <path class="line" d="M660 434 V473"/>
  <path d="M653 473 L660 485 L667 473 Z" fill="#344f5d"/>
  <rect class="box" x="551" y="495" width="218" height="61" rx="8"/>
  <text class="label" x="660" y="533" text-anchor="middle">Legal-action mask</text>
  <line x1="490" y1="582" x2="830" y2="582" stroke="#b8c9d0" stroke-width="2"/>
  <text class="minor" x="490" y="622">Head counts vary by interface.</text>

  <rect class="selected" x="898" y="14" width="394" height="642" rx="13"/>
  <text class="title accent" x="925" y="62">From-to attention</text>
  <text class="minor accent" x="925" y="91">RETAINED</text>
  <rect x="925" y="125" width="89" height="89" fill="url(#board)" stroke="#2878bd" stroke-width="2"/>
  <circle cx="955" cy="158" r="7" fill="#175b91"/>
  <circle cx="985" cy="146" r="7" fill="#7ab4e3"/>
  <text class="minor" x="970" y="258" text-anchor="middle">64 tokens</text>
  <path class="accent-line" d="M1025 169 H1042"/>
  <rect class="accent-box" x="1051" y="125" width="83" height="42" rx="7"/>
  <text class="minor" x="1093" y="153" text-anchor="middle">query</text>
  <rect class="accent-box" x="1051" y="178" width="83" height="42" rx="7"/>
  <text class="minor" x="1093" y="206" text-anchor="middle">key</text>
  <path class="accent-line" d="M1134 146 H1146 V172 H1153 M1134 199 H1146 V172"/>
  <rect x="1162" y="125" width="94" height="94" fill="url(#matrix)" stroke="#2878bd" stroke-width="2"/>
  <line x1="1180" y1="199" x2="1238" y2="143" stroke="#175b91" stroke-width="4"/>
  <text class="minor" x="1209" y="258" text-anchor="middle">64 × 64 scores</text>
  <path class="accent-line" d="M1095 271 V301"/>
  <path d="M1088 301 L1095 313 L1102 301 Z" fill="#17615b"/>
  <rect class="accent-box" x="930" y="318" width="330" height="105" rx="8"/>
  <text class="label" x="1095" y="355" text-anchor="middle">Fixed gather + promotion</text>
  <text class="body" x="1095" y="394" text-anchor="middle">1,880 action logits</text>
  <path class="accent-line" d="M1095 434 V473"/>
  <path d="M1088 473 L1095 485 L1102 473 Z" fill="#17615b"/>
  <rect class="accent-box" x="986" y="495" width="218" height="61" rx="8"/>
  <text class="label accent" x="1095" y="533" text-anchor="middle">Legal-action mask</text>
  <line x1="925" y1="582" x2="1265" y2="582" stroke="#b8d5ee" stroke-width="2"/>
  <text class="count accent" x="925" y="621">51,072</text>
  <text class="minor" x="1037" y="620">head parameters</text>
</svg>
