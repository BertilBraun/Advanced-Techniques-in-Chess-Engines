line-length = 120
target-version = 'py312'

[lint]
select = ['E4', 'E7', 'E9', 'F', 'I']
ignore = ['F405', 'F403']

[lint.isort]
required-imports = ['from __future__ import annotations']

[lint.per-file-ignores]
'py/train.py' = ['E402']
'py/tools/init_probe.py' = ['E402']
# The colour-symmetry harness is a frozen validation gate; restyling it is not worth re-validating it.
'cpp/test/flip-harness/*.py' = ['E4', 'E7', 'F841', 'I']

[format]
quote-style = 'single'
docstring-code-format = true
